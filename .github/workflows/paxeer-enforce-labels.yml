name: Paxeer / Enforce PR Labels

on:
  pull_request:
    types: [labeled, unlabeled, opened, edited, synchronize]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'chain.mk'
      - 'docker/layerx/Dockerfile'
      - 'docker/layerx/Dockerfile.dockerignore'
      - 'foundry.paxeer.toml'
      - 'buf.gen.yaml'
      - 'buf.lock'
      - 'buf.yaml'
      - '.github/codecov.yml'
      - '.golangci.yml'
      - 'tools/repotest/gen.go'
      - 'tools/repotest/link_directives_test.go'
      - 'tools/repotest/mod_test.go'
      - 'scripts/run_blocktests.sh'
      - 'tools/release/version.json'
      - 'admin/**'
      - 'api/**'
      - 'tools/benchmark/**'
      - 'consensus/**'
      - 'custodyproof/**'
      - 'daemon/**'
      - 'docker/**'
      - 'engine/**'
      - 'tests/fixtures/example/**'
      - 'hpx/**'
      - 'tests/integration/**'
      - 'interchain/**'
      - 'modules/**'
      - 'node/**'
      - 'occ_tests/**'
      - 'precompiles/**'
      - 'rpc/**'
      - 'sdk/**'
      - 'storage/**'
      - 'tests/testutil/**'
      - 'utils/**'
      - 'wasm/**'
      - 'wasm-runtime/**'
      - 'contracts/src/**'
      - 'contracts/test/**'
      - 'contracts/scripts/**'
      - 'contracts/wasm/**'
      - 'docs/swagger/**'
      - 'docs/swagger-ui/**'
      - 'tests/chain/**'
      - 'tools/chain/**'
      - 'tools/tx-scanner/**'
      - 'tools/utils/**'
      - 'contracts/config/client.toml'
      - 'contracts/hardhat.config.js'
      - 'contracts/package.json'
      - 'contracts/package-lock.json'
      - 'contracts/tsconfig.json'
      - 'docs/evm_jsonrpc_unsupported.md'
      - 'docs/paxeer-network.md'
      - 'docs/paxeer-chain-docs.md'
      - 'scripts/**'
      - '!scripts/PaxeerBetaDeploy.s.sol'
      - '!scripts/qualify-mirror-live.sh'
      - '!scripts/qualify-mirror-verification-live.sh'
      - '.github/workflows/paxeer-enforce-labels.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  enforce-label:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
    - uses: yogevbd/enforce-label-action@8d1e1709b1011e6d90400a0e6cf7c0b77aa5efeb # 2.1.0
      with:
        REQUIRED_LABELS_ANY: "app-hash-breaking,non-app-hash-breaking"
        REQUIRED_LABELS_ANY_DESCRIPTION: "Select at least one label ['app-hash-breaking', 'non-app-hash-breaking']"
