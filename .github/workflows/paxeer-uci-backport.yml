name: Paxeer / UCI Backport
run-name: Paxeer / UCI / Backport

on:
  pull_request_target:
    types:
      - closed
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'chain.mk'
      - 'docker/layerx/Dockerfile'
      - 'docker/layerx/Dockerfile.dockerignore'
      - 'foundry.paxeer.toml'
      - 'buf.gen.yaml'
      - 'buf.lock'
      - 'buf.yaml'
      - '.github/codecov.yml'
      - '.golangci.yml'
      - 'tools/repotest/gen.go'
      - 'tools/repotest/link_directives_test.go'
      - 'tools/repotest/mod_test.go'
      - 'scripts/run_blocktests.sh'
      - 'tools/release/version.json'
      - 'admin/**'
      - 'api/**'
      - 'tools/benchmark/**'
      - 'consensus/**'
      - 'custodyproof/**'
      - 'daemon/**'
      - 'docker/**'
      - 'engine/**'
      - 'tests/fixtures/example/**'
      - 'tools/hpx/**'
      - 'tests/integration/**'
      - 'interchain/**'
      - 'modules/**'
      - 'node/**'
      - 'tests/occ/**'
      - 'precompiles/**'
      - 'rpc/**'
      - 'sdk/**'
      - 'storage/**'
      - 'tests/testutil/**'
      - 'utils/**'
      - 'wasm/**'
      - 'wasm-runtime/**'
      - 'contracts/src/**'
      - 'contracts/test/**'
      - 'contracts/scripts/**'
      - 'contracts/wasm/**'
      - 'docs/swagger/**'
      - 'docs/swagger-ui/**'
      - 'tests/chain/**'
      - 'tools/chain/**'
      - 'tools/tx-scanner/**'
      - 'tools/utils/**'
      - 'contracts/config/client.toml'
      - 'contracts/hardhat.config.js'
      - 'contracts/package.json'
      - 'contracts/package-lock.json'
      - 'contracts/tsconfig.json'
      - 'docs/evm_jsonrpc_unsupported.md'
      - 'docs/paxeer-network.md'
      - 'docs/paxeer-chain-docs.md'
      - 'scripts/**'
      - '!scripts/PaxeerBetaDeploy.s.sol'
      - '!scripts/qualify-mirror-live.sh'
      - '!scripts/qualify-mirror-verification-live.sh'
      - '.github/workflows/paxeer-uci-backport.yml'
  issue_comment:
    types:
      - created

concurrency:
  group: ${{ github.workflow }}-${{ github.event.comment.id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  scope:
    name: Confirm Paxeer scope
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    outputs:
      paxeer: ${{ steps.files.outputs.paxeer }}
    steps:
      - id: files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pull_number = context.issue.number;
            if (!pull_number) {
              core.setOutput('paxeer', 'false');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
              per_page: 100,
            });
            const chainFiles = ['go.mod', 'go.sum', 'chain.mk', 'docker/layerx/Dockerfile', 'docker/layerx/Dockerfile.dockerignore', 'foundry.paxeer.toml', 'buf.gen.yaml', 'buf.lock', 'buf.yaml', '.github/codecov.yml', '.golangci.yml', 'tools/repotest/gen.go', 'tools/repotest/link_directives_test.go', 'tools/repotest/mod_test.go', 'scripts/run_blocktests.sh', 'tools/release/version.json', 'contracts/config/client.toml', 'contracts/hardhat.config.js', 'contracts/package.json', 'contracts/package-lock.json', 'contracts/tsconfig.json', 'docs/evm_jsonrpc_unsupported.md', 'docs/paxeer-network.md', 'docs/paxeer-chain-docs.md'];
            const chainPrefixes = ['admin/', 'api/', 'tools/benchmark/', 'consensus/', 'custodyproof/', 'daemon/', 'docker/', 'engine/', 'tests/fixtures/example/', 'tools/hpx/', 'tests/integration/', 'interchain/', 'modules/', 'node/', 'tests/occ/', 'precompiles/', 'rpc/', 'sdk/', 'storage/', 'tests/testutil/', 'utils/', 'wasm/', 'wasm-runtime/', 'contracts/src/', 'contracts/test/', 'contracts/scripts/', 'contracts/wasm/', 'docs/swagger/', 'docs/swagger-ui/', 'tests/chain/', 'tools/chain/', 'tools/tx-scanner/', 'tools/utils/'];
            const layerxScripts = ['scripts/PaxeerBetaDeploy.s.sol', 'scripts/qualify-mirror-live.sh', 'scripts/qualify-mirror-verification-live.sh'];
            const inScope = files.some(({ filename }) =>
              chainFiles.includes(filename) ||
              chainPrefixes.some((prefix) => filename.startsWith(prefix)) ||
              (filename.startsWith('scripts/') && !layerxScripts.includes(filename)) ||
              filename === '.github/workflows/paxeer-uci-backport.yml'
            );
            core.setOutput('paxeer', String(inScope));
  backport:
    name: Backport
    needs: scope
    if: needs.scope.outputs.paxeer == 'true'
    uses: Paxeer-Network/pax-uci/.github/workflows/backport.yml@5acbd8eef65336b0619b46de3bfddfe84841a7fb # v0.0.9
    secrets: inherit
    with:
      backport-team: 'Paxeer-Network/pax-core'
