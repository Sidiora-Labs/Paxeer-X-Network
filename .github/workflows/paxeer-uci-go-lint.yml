  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'chain.mk'
      - 'docker/layerx/Dockerfile'
      - 'docker/layerx/Dockerfile.dockerignore'
      - 'foundry.paxeer.toml'
      - 'buf.gen.yaml'
      - 'buf.lock'
      - 'buf.yaml'
      - '.github/codecov.yml'
      - '.golangci.yml'
      - 'tools/repotest/gen.go'
      - 'tools/repotest/link_directives_test.go'
      - 'tools/repotest/mod_test.go'
      - 'scripts/run_blocktests.sh'
      - 'tools/release/version.json'
      - 'admin/**'
      - 'api/**'
      - 'tools/benchmark/**'
      - 'consensus/**'
      - 'custodyproof/**'
      - 'daemon/**'
      - 'docker/**'
      - 'engine/**'
      - 'tests/fixtures/example/**'
      - 'hpx/**'
      - 'tests/integration/**'
      - 'interchain/**'
      - 'modules/**'
      - 'node/**'
      - 'tests/occ/**'
      - 'precompiles/**'
      - 'rpc/**'
      - 'sdk/**'
      - 'storage/**'
      - 'tests/testutil/**'
      - 'utils/**'
      - 'wasm/**'
      - 'wasm-runtime/**'
      - 'contracts/src/**'
      - 'contracts/test/**'
      - 'contracts/scripts/**'
      - 'contracts/wasm/**'
      - 'docs/swagger/**'
      - 'docs/swagger-ui/**'
      - 'tests/chain/**'
      - 'tools/chain/**'
      - 'tools/tx-scanner/**'
      - 'tools/utils/**'
      - 'contracts/config/client.toml'
      - 'contracts/hardhat.config.js'
      - 'contracts/package.json'
      - 'contracts/package-lock.json'
      - 'contracts/tsconfig.json'
      - 'docs/evm_jsonrpc_unsupported.md'
      - 'docs/paxeer-network.md'
      - 'docs/paxeer-chain-docs.md'
      - 'scripts/**'
      - '!scripts/PaxeerBetaDeploy.s.sol'
      - '!scripts/qualify-mirror-live.sh'
      - '!scripts/qualify-mirror-verification-live.sh'
      - '.github/workflows/paxeer-uci-go-lint.yml'
  merge_group:
  push:
    branches:
      - main
      - release/**
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'chain.mk'
      - 'docker/layerx/Dockerfile'
      - 'docker/layerx/Dockerfile.dockerignore'
      - 'foundry.paxeer.toml'
      - 'buf.gen.yaml'
      - 'buf.lock'
      - 'buf.yaml'
      - '.github/codecov.yml'
      - '.golangci.yml'
      - 'tools/repotest/gen.go'
      - 'tools/repotest/link_directives_test.go'
      - 'tools/repotest/mod_test.go'
      - 'scripts/run_blocktests.sh'
      - 'tools/release/version.json'
      - 'admin/**'
      - 'api/**'
      - 'tools/benchmark/**'
      - 'consensus/**'
      - 'custodyproof/**'
      - 'daemon/**'
      - 'docker/**'
      - 'engine/**'
      - 'tests/fixtures/example/**'
      - 'hpx/**'
      - 'tests/integration/**'
      - 'interchain/**'
      - 'modules/**'
      - 'node/**'
      - 'tests/occ/**'
      - 'precompiles/**'
      - 'rpc/**'
      - 'sdk/**'
      - 'storage/**'
      - 'tests/testutil/**'
      - 'utils/**'
      - 'wasm/**'
      - 'wasm-runtime/**'
      - 'contracts/src/**'
      - 'contracts/test/**'
      - 'contracts/scripts/**'
      - 'contracts/wasm/**'
      - 'docs/swagger/**'
      - 'docs/swagger-ui/**'
      - 'tests/chain/**'
      - 'tools/chain/**'
      - 'tools/tx-scanner/**'
      - 'tools/utils/**'
      - 'contracts/config/client.toml'
      - 'contracts/hardhat.config.js'
      - 'contracts/package.json'
      - 'contracts/package-lock.json'
      - 'contracts/tsconfig.json'
      - 'docs/evm_jsonrpc_unsupported.md'
      - 'docs/paxeer-network.md'
      - 'docs/paxeer-chain-docs.md'
      - 'scripts/**'
      - '!scripts/PaxeerBetaDeploy.s.sol'
      - '!scripts/qualify-mirror-live.sh'
      - '!scripts/qualify-mirror-verification-live.sh'
      - '.github/workflows/paxeer-uci-go-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    name: Go
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.6'
          cache-dependency-path: go.sum
      - name: Check module tidiness
        run: |
          had_sum=$( [ -f go.sum ] && echo true || echo false )
          go mod tidy
          git diff --exit-code -- go.mod
          if [ -f go.sum ]; then
            if [ "$had_sum" = true ]; then
              git diff --exit-code -- go.sum
            else
              echo "error: go.sum was created by 'go mod tidy' but is not checked in"
              exit 1
            fi
          fi
      - name: Vet Go files
        if: always()
        run: go vet ./...
      - name: Check formatting
        if: always()
        run: |
          if out="$(gofmt -s -l .)" && test -n "$out"; then
            echo "Files not gofmt-ed:"
            echo "$out"
            exit 1
          fi
      - name: Check generated files
        if: always()
        run: |
          go generate -x ./...
          git diff --exit-code -- .
