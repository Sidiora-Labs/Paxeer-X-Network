name: Paxeer / Release Publish

on:
  push:
    tags:
      - 'paxeer-network/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing paxeer-network/vX.Y.Z tag to publish
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  releaser:
    name: Build and publish Paxeer release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Validate tag against tools/release/version.json
        run: |
          set -euo pipefail
          version=$(jq -er '.version' tools/release/version.json)
          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver_re ]]; then
            echo "Invalid Paxeer semantic version: $version"
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "paxeer-network/$version" ]]; then
            echo "Tag $RELEASE_TAG does not match tools/release/version.json $version"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install native build dependencies
        run: |
          set -euo pipefail
          . tools/release/toolchain.env
          : "${CC_VERSION:?tools/release/toolchain.env must pin CC_VERSION}"
          cc_package="gcc-${CC_VERSION%%.*}"
          sudo apt-get update
          cc_package_version=$(apt-cache madison "$cc_package" | awk -v version="$CC_VERSION" '
            { candidate = $3; sub(/^[0-9]+:/, "", candidate) }
            index(candidate, version "-") == 1 { print $3; exit }
          ')
          if [[ -z "$cc_package_version" ]]; then
            echo "No package for $cc_package at CC_VERSION $CC_VERSION" >&2
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev libsqlite3-dev \
            "$cc_package=$cc_package_version" "g++-${CC_VERSION%%.*}=$cc_package_version"
          compiler_bin="$RUNNER_TEMP/release-toolchain/bin"
          mkdir -p "$compiler_bin"
          ln -sf "/usr/bin/$cc_package" "$compiler_bin/cc"
          ln -sf "/usr/bin/$cc_package" "$compiler_bin/gcc"
          ln -sf "/usr/bin/g++-${CC_VERSION%%.*}" "$compiler_bin/c++"
          ln -sf "/usr/bin/g++-${CC_VERSION%%.*}" "$compiler_bin/g++"
          export PATH="$compiler_bin:$PATH"
          echo "$compiler_bin" >> "$GITHUB_PATH"
          have_cc=$(cc -dumpfullversion)
          printf '%s\n' "$have_cc"
          if [[ "$have_cc" != "$CC_VERSION" ]]; then
            echo "build-paxd: toolchain.env pins cc $CC_VERSION, found $have_cc" >&2
            exit 1
          fi
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --no-self-update
      - name: Build release binaries
        env:
          PAXD_RELEASE_LAYERXD: '1'
        run: tools/release/build-paxd.sh
      - name: Generate release notes
        run: |
          set -euo pipefail
          python3 -m pip install --user git-cliff==2.8.0
          git-cliff --config .github/cliff.toml --tag-pattern '^paxeer-network/v[0-9]' --current --strip header \
            --output "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#paxeer-network/}
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Paxeer X Network $version" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "dist/$RELEASE_TAG"/*
          {
            echo "### Paxeer X Network release $RELEASE_TAG"
            echo '```'
            cat "dist/$RELEASE_TAG/SHA256SUMS"
            echo '```'
            echo "$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
          } >> "$GITHUB_STEP_SUMMARY"
