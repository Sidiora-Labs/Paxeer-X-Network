name: Publish beta images

# Every push to main that touches an image input builds each row of the shared image table
# (platform/hosted/tests/beta-images.sh) and pushes it to GHCR as :<12-hex sha> and :<git describe>.
# The signed release path (gate, publish, attest, promote) runs only from a release tag or from the
# named release candidate: the moving :beta tag is repointed in the promote job after the published
# digest of every image has been verified against its signature, its SBOM attestation and its build
# provenance.
on:
  push:
    branches: [main]
    tags: ["sdk-v*"]
    paths:
      - docker/**
      - platform/**
      - interop/**
      - human/wallet/**
      - explorer/**
  workflow_dispatch:
    inputs:
      release_candidate:
        description: The 40-hex default-branch commit matching this workflow dispatch SHA
        required: true
        type: string
      runner:
        description: Runner label for the gate and image build jobs
        required: false
        default: ubuntu-latest
        type: choice
        options: [ubuntu-latest, lx-runner]

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '4'
  MAKEFLAGS: -j4
  LAYERX_PUBLISH_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_candidate || github.sha }}
  LAYERX_PUBLISH_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
  LAYERX_PUBLISH_RELEASE_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_candidate || '' }}
  LAYERX_PUBLISH_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  LAYERX_PUBLISH_OUTPUT: build/beta-cluster/publication

jobs:
  plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      images: ${{ steps.plan.outputs.images }}
      dependent: ${{ steps.plan.outputs.dependent }}
      sha: ${{ steps.plan.outputs.sha }}
      describe: ${{ steps.plan.outputs.describe }}
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Turn every row of the shared image table into a build matrix entry
        id: plan
        run: |
          set -euo pipefail
          fail() { echo "$*" >&2; exit 1; }
          source platform/hosted/tests/beta-images.sh
          REVISION=$(git rev-parse --short=12 HEAD)
          image_ref() { printf 'ghcr.io/sidiora-labs/%s:%s' "$1" "$REVISION"; }
          entries=$(for name in "${IMAGE_NAMES[@]}"; do
            read -r canonical dockerfile <<<"$(image_source "$name")"
            jq -n -c --arg name "$name" --arg dockerfile "$dockerfile" --arg target "$(image_target "$name")" \
              --arg args "$(image_build_args "$name" | sed -E 's/--build-arg //g; s/ +/\n/g')" \
              '{name: $name, dockerfile: $dockerfile, target: $target, build_args: $args}'
          done)
          {
            # paxd builds FROM the pushed paxd-node image, so it runs after the matrix
            printf 'images=%s\n' "$(jq -s -c 'map(select(.name != "paxd"))' <<<"$entries")"
            printf 'dependent=%s\n' "$(jq -s -c 'map(select(.name == "paxd"))' <<<"$entries")"
            printf 'sha=%s\n' "$REVISION"
            printf 'describe=%s\n' "$(git describe --tags --always --abbrev=12)"
          } >> "$GITHUB_OUTPUT"

  images:
    needs: [plan]
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          build-args: ${{ matrix.image.build_args }}
          push: true
          tags: |
            ghcr.io/sidiora-labs/${{ matrix.image.name }}:${{ needs.plan.outputs.sha }}
            ghcr.io/sidiora-labs/${{ matrix.image.name }}:${{ needs.plan.outputs.describe }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  images-dependent:
    needs: [plan, images]
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.dependent) }}
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          build-args: ${{ matrix.image.build_args }}
          push: true
          tags: |
            ghcr.io/sidiora-labs/${{ matrix.image.name }}:${{ needs.plan.outputs.sha }}
            ghcr.io/sidiora-labs/${{ matrix.image.name }}:${{ needs.plan.outputs.describe }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  gate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - name: Check out the workflow event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-tags: true
          persist-credentials: false
      - name: Resolve and bind the published revision
        id: revision
        run: |
          bash platform/hosted/tests/publish-images.sh --source-policy
          revision=$(git rev-parse HEAD)
          test "$revision" = "$LAYERX_PUBLISH_REVISION"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          build-essential libssl-dev libsqlite3-dev ripgrep
      - name: Build and test the native core the images carry
        env:
          CC: gcc
        run: make build test scan-consensus
      - name: Check the executed-evidence ledger
        run: make beta-ledger-check
      - name: Check the publisher and the shared image table
        run: bash -n platform/hosted/tests/publish-images.sh platform/hosted/tests/beta-images.sh

  publish:
    needs: [gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      images: ${{ steps.digests.outputs.images }}
      published: ${{ steps.digests.outputs.published }}
    env:
      LAYERX_PUBLISH_GATE_REVISION: ${{ needs.gate.outputs.revision }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # This job builds the image set without creating a cluster or loading it into kind nodes, so it names its
      # own free-disk bound instead of the 24 GiB a local beta cluster bring-up requires: a standard hosted
      # ubuntu-24.04 runner provides 14 GB (13.0 GiB) of SSD space, which the local bound refuses outright.
      LAYERX_BETA_IMAGE_MIN_FREE_GIB: '12'
    steps:
      - name: Check out the revision that is to be published
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.revision }}
          fetch-tags: true
          persist-credentials: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Build all beta images using the shared cluster image table and contexts
        run: bash platform/hosted/tests/beta-cluster.sh images
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin
      - name: Push the immutable revision tag, generate the SBOM and sign every image
        run: |
          bash platform/hosted/tests/beta-cluster.sh publish-images push \
            ${LAYERX_PUBLISH_RELEASE_TAG:+--release-tag "$LAYERX_PUBLISH_RELEASE_TAG"} \
            ${LAYERX_PUBLISH_RELEASE_CANDIDATE:+--release-candidate "$LAYERX_PUBLISH_RELEASE_CANDIDATE"} \
            --output "$LAYERX_PUBLISH_OUTPUT"
      - name: Publish the image set and the digests the attestation jobs bind to
        id: digests
        run: |
          {
            printf 'images=%s\n' "$(jq -R -s -c '[splits("\n") | select(length > 0) | split(" ")[0]]' \
              < "$LAYERX_PUBLISH_OUTPUT/digests.txt")"
            printf 'published=%s\n' "$(jq -R -s -c '
              [splits("\n") | select(length > 0) | split(" ")]
              | map({key: .[0], value: {name: .[1], digest: .[2]}}) | from_entries' \
              < "$LAYERX_PUBLISH_OUTPUT/digests.txt")"
          } >> "$GITHUB_OUTPUT"
      - name: Retain the SBOMs, the digests and the publication record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-image-publication
          path: ${{ env.LAYERX_PUBLISH_OUTPUT }}
          if-no-files-found: error
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  attest:
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: ${{ fromJSON(needs.publish.outputs.images) }}
    steps:
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin
      - name: Attest the build provenance of the published image digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ fromJSON(needs.publish.outputs.published)[matrix.image].name }}
          subject-digest: ${{ fromJSON(needs.publish.outputs.published)[matrix.image].digest }}
          push-to-registry: true
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  promote:
    needs: [gate, publish, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: read
    env:
      LAYERX_PUBLISH_GATE_REVISION: ${{ needs.gate.outputs.revision }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the revision that is to be published
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.revision }}
          fetch-tags: true
          persist-credentials: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Restore the SBOMs, the digests and the publication record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: beta-image-publication
          path: ${{ env.LAYERX_PUBLISH_OUTPUT }}
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin
      - name: Verify every published digest and only then repoint the release and beta tags
        run: |
          bash platform/hosted/tests/beta-cluster.sh publish-images promote \
            ${LAYERX_PUBLISH_RELEASE_TAG:+--release-tag "$LAYERX_PUBLISH_RELEASE_TAG"} \
            ${LAYERX_PUBLISH_RELEASE_CANDIDATE:+--release-candidate "$LAYERX_PUBLISH_RELEASE_CANDIDATE"} \
            --output "$LAYERX_PUBLISH_OUTPUT"
      - name: Retain the verification evidence of the promotion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-image-verification
          path: ${{ env.LAYERX_PUBLISH_OUTPUT }}
          if-no-files-found: error
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
