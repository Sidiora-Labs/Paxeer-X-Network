name: Paxeer / Release Check

on:
  pull_request:
    paths:
      - 'tools/release/version.json'
      - 'go.mod'
      - 'go.sum'
      - 'chain.mk'
      - 'daemon/**'
      - 'modules/**'
      - 'precompiles/**'
      - 'node/**'
      - 'sdk/**'
      - 'wasm-runtime/**'
      - 'src/**'
      - 'include/**'
      - 'Makefile'
      - 'rust-toolchain.toml'
      - 'programs/**'
      - 'services/platform/Cargo.toml'
      - 'services/platform/Cargo.lock'
      - 'services/platform/hosted/feeder/**'
      - 'tools/price-sidecar/**'
      - 'tools/release/**'
      - '.github/workflows/paxeer-release-check.yml'
      - '.github/workflows/paxeer-release-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Validate Paxeer release identity and reproducibility
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout code and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate version and namespaced tag
        run: |
          set -euo pipefail
          version=$(jq -er '.version' tools/release/version.json)
          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver_re ]]; then
            echo "Invalid Paxeer semantic version: $version"
            exit 1
          fi
          upgrade=$(jq -er '.upgrade' tools/release/version.json)
          if ! grep -qxF "const V6120Upgrade = \"$upgrade\"" node/upgrades_v6120.go; then
            echo "Upgrade name $upgrade is not declared as V6120Upgrade in node/upgrades_v6120.go"
            exit 1
          fi

          tag="paxeer-network/$version"
          if git rev-parse --verify --quiet "refs/tags/$tag"; then
            echo "Paxeer release tag already exists: $tag"
            exit 1
          fi

          latest=$(git tag --list 'paxeer-network/v*' --sort=-v:refname | head -n 1)
          if [[ -n "$latest" ]]; then
            latest_version=${latest#paxeer-network/}
            greatest=$(printf '%s\n%s\n' "$latest_version" "$version" | sort -V | tail -n 1)
            if [[ "$greatest" != "$version" || "$latest_version" == "$version" ]]; then
              echo "Paxeer version $version must be newer than $latest_version"
              exit 1
            fi
          fi

          echo "Paxeer release identity is $tag (upgrade $upgrade)"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install native build dependencies
        run: |
          set -euo pipefail
          . tools/release/toolchain.env
          : "${CC_VERSION:?tools/release/toolchain.env must pin CC_VERSION}"
          cc_package="gcc-${CC_VERSION%%.*}"
          sudo apt-get update
          cc_package_version=$(apt-cache madison "$cc_package" | awk -v version="$CC_VERSION" '
            { candidate = $3; sub(/^[0-9]+:/, "", candidate) }
            index(candidate, version "-") == 1 { print $3; exit }
          ')
          if [[ -z "$cc_package_version" ]]; then
            echo "No package for $cc_package at CC_VERSION $CC_VERSION" >&2
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev libsqlite3-dev \
            "$cc_package=$cc_package_version" "g++-${CC_VERSION%%.*}=$cc_package_version"
          compiler_bin="$RUNNER_TEMP/release-toolchain/bin"
          mkdir -p "$compiler_bin"
          ln -sf "/usr/bin/$cc_package" "$compiler_bin/cc"
          ln -sf "/usr/bin/$cc_package" "$compiler_bin/gcc"
          ln -sf "/usr/bin/g++-${CC_VERSION%%.*}" "$compiler_bin/c++"
          ln -sf "/usr/bin/g++-${CC_VERSION%%.*}" "$compiler_bin/g++"
          export PATH="$compiler_bin:$PATH"
          echo "$compiler_bin" >> "$GITHUB_PATH"
          have_cc=$(cc -dumpfullversion)
          printf '%s\n' "$have_cc"
          if [[ "$have_cc" != "$CC_VERSION" ]]; then
            echo "build-paxd: toolchain.env pins cc $CC_VERSION, found $have_cc" >&2
            exit 1
          fi
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --no-self-update
      - name: Check reproducible release build
        env:
          PAXD_RELEASE_LAYERXD: '1'
        run: tools/release/reproducible-check.sh
