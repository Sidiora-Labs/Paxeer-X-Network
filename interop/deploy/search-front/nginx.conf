worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;

    resolver [fdaa::3] valid=30s;

    # The edge nginx sends the client address as X-Real-IP, while Fly-Client-IP
    # behind it is the edge's own address; Fly-Client-IP keys a request that
    # did not cross the edge.
    map $http_x_real_ip $xweb_client {
        ""      $http_fly_client_ip;
        default $http_x_real_ip;
    }

    # The split_clients block of tools/bringup/search-front.sh render sets
    # $xweb_node, one serving RPC name per client address: every machine
    # hashes the same $xweb_client over the same list, so the 402 answer and
    # the paid retry reach the receiver that priced the request. An empty
    # list leaves the name empty and readiness and search paths answer 503.
    include /etc/nginx/search/upstreams.conf;

    server {
        listen [::]:8080 ipv6only=off;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /readyz {
            if ($xweb_node = "") { return 503; }
            if ($xweb_eligible = 0) { return 503; }
            proxy_pass https://$xweb_node/readyz;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            proxy_next_upstream off;
            error_page 500 502 503 504 =503 @not_ready;
        }

        location = /_search_ready {
            internal;
            proxy_pass https://$xweb_node/readyz;
            proxy_http_version 1.1;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            proxy_next_upstream off;
        }

        location @not_ready {
            default_type application/json;
            add_header X-Search-Node $xweb_node always;
            add_header Retry-After 1 always;
            return 503 '{"ready":false,"error":"selected_backend_unavailable"}\n';
        }

        location = /xweb/health {
            if ($xweb_node = "") { return 502; }
            proxy_pass https://$xweb_node;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_pass_header Server;
            proxy_pass_header Date;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_next_upstream off;
        }

        location ~ ^/(search|fetch|content/) {
            add_header X-Search-Node $xweb_node always;
            if ($xweb_node = "") {
                return 503;
            }
            if ($xweb_eligible = 0) { return 503; }
            auth_request /_search_ready;
            error_page 500 502 503 504 =503 @not_ready;
            proxy_pass https://$xweb_node;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_pass_header Server;
            proxy_pass_header Date;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_next_upstream off;
        }

        location / {
            return 404;
        }
    }
}
