# Included once in the server block of the host's apiN vhost: the search paths
# reach the loopback x-websearch serving sidecar of x-websearch-serve.service.
location ~ ^/(search|fetch|content/) {
    proxy_pass http://127.0.0.1:8482;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location = /xweb/health {
    proxy_pass http://127.0.0.1:8482/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
