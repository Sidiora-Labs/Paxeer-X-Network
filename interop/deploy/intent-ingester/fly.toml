# The exchange intent ingester: tails the exchange, bridge and launchpad
# precompile logs from a co-located Paxeer node, journals each intent once,
# and submits orders, cancels and settlements to the kernel through the
# gateway's lx_sendActivity. One machine, because the cursor, the intent
# journal and the settlement journal under /data/intent-ingester have one
# writer. Deploy values are set per deploy, never here:
#   INGESTER_RPC_URL                  http:// node JSON-RPC the logs are read from
#   LAYERX_INGESTER_GATEWAY_URL       http:// gateway JSON-RPC (lx_getSequence, lx_sendActivity)
#   LAYERX_INGESTER_GATEWAY_API_KEY   gateway API key with activity scope (secret)
#   LAYERX_INGESTER_NETWORK_ID        kernel network id
#   LAYERX_INGESTER_FEE_LIMIT         fee limit signed into every activity
# The signer seed and the market map are file secrets mounted below.
app = "paxeer-intent-ingester"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "docker/intent-ingester/Dockerfile"

[deploy]
  strategy = "immediate"

[env]
  INGESTER_STATE_DIR = "/data/intent-ingester"
  INGESTER_LISTEN = "[::]:8490"
  INGESTER_INTERVAL_MS = "1000"
  LAYERX_INGESTER_SIGNER_KEY_FILE = "/run/secrets/intent-ingester/signer.key"
  LAYERX_INGESTER_MARKET_MAP = "/run/secrets/intent-ingester/markets.json"

[[files]]
  guest_path = "/run/secrets/intent-ingester/signer.key"
  secret_name = "INTENT_INGESTER_SIGNER_KEY"

[[files]]
  guest_path = "/run/secrets/intent-ingester/markets.json"
  secret_name = "INTENT_INGESTER_MARKET_MAP"

[[mounts]]
  source = "intent_ingester_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 14

[checks]
  [checks.readyz]
    type = "http"
    port = 8490
    path = "/readyz"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
  cpu_kind = "shared"
