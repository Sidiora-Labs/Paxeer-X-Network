app = "paxeer-bridge-relayer-1"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "docker/bridge-relayer/Dockerfile"

[env]
  LAYERX_BRIDGE_COSIGN_TRANSPORT_CONFIG = "/run/secrets/bridge/cosign/transport.json"
  LAYERX_BRIDGE_OPERATOR_INVENTORY = "/run/secrets/bridge/cosign/operators.json"
  LAYERX_BRIDGE_RELAYER_CONFIG = "/run/secrets/bridge/relayer.json"
  LAYERX_BRIDGE_ATTESTOR_INDEX = "1"
  LAYERX_BRIDGE_ATTESTOR_SET_SIZE = "5"
  LAYERX_BRIDGE_ATTESTOR_THRESHOLD = "3"
  LAYERX_BRIDGE_ATTESTOR_KEY_FILE = "/run/secrets/bridge/signer/attestor-1.key"
  LAYERX_BRIDGE_COSIGN_CA = "/run/secrets/bridge/cosign/ca.pem"
  LAYERX_BRIDGE_APPROVED_MEMBERSHIP = "/run/secrets/bridge/cosign/membership.json"

[[files]]
  guest_path = "/run/secrets/bridge/relayer.json"
  secret_name = "BRIDGE_RELAYER_CONFIG"

[[files]]
  guest_path = "/run/secrets/bridge/rpc-tokens"
  secret_name = "BRIDGE_RELAYER_RPC_TOKENS"

[[files]]
  guest_path = "/etc/layerx/bridge-signer/keys.json"
  secret_name = "BRIDGE_SIGNER_KEYS"

[[files]]
  guest_path = "/run/secrets/bridge/signer/attestor-1.key"
  secret_name = "BRIDGE_SIGNER_ATTESTOR_KEY"

[[files]]
  guest_path = "/run/secrets/bridge/signer/paxeer-submitter.key"
  secret_name = "BRIDGE_SIGNER_PAXEER_SUBMITTER_KEY"

[[files]]
  guest_path = "/run/secrets/bridge/signer/arbitrum-submitter.key"
  secret_name = "BRIDGE_SIGNER_ARBITRUM_SUBMITTER_KEY"

[[files]]
  guest_path = "/run/secrets/bridge/signer/avalanche-submitter.key"
  secret_name = "BRIDGE_SIGNER_AVALANCHE_SUBMITTER_KEY"

[[files]]
  guest_path = "/run/secrets/bridge/signer/base-submitter.key"
  secret_name = "BRIDGE_SIGNER_BASE_SUBMITTER_KEY"

[[files]]
  guest_path = "/run/secrets/bridge/signer/bnb-submitter.key"
  secret_name = "BRIDGE_SIGNER_BNB_SUBMITTER_KEY"

[[files]]
  guest_path = "/run/secrets/bridge/signer/ethereum-submitter.key"
  secret_name = "BRIDGE_SIGNER_ETHEREUM_SUBMITTER_KEY"

[[files]]
  guest_path = "/run/secrets/bridge/signer/hyperevm-submitter.key"
  secret_name = "BRIDGE_SIGNER_HYPEREVM_SUBMITTER_KEY"

[[files]]
  guest_path = "/run/secrets/bridge/signer/optimism-submitter.key"
  secret_name = "BRIDGE_SIGNER_OPTIMISM_SUBMITTER_KEY"

[[files]]
  guest_path = "/run/secrets/bridge/signer/polygon-submitter.key"
  secret_name = "BRIDGE_SIGNER_POLYGON_SUBMITTER_KEY"

[[files]]
  guest_path = "/run/secrets/bridge/signer/solana-fee-payer.json"
  secret_name = "BRIDGE_SIGNER_SOLANA_FEE_PAYER_KEYPAIR"

[[files]]
  guest_path = "/run/secrets/bridge/cosign/transport.json"
  secret_name = "BRIDGE_COSIGN_TRANSPORT_CONFIG"

[[files]]
  guest_path = "/run/secrets/bridge/cosign/ca.pem"
  secret_name = "BRIDGE_COSIGN_TRUST_ANCHOR"

[[files]]
  guest_path = "/run/secrets/bridge/cosign/certificate.pem"
  secret_name = "BRIDGE_COSIGN_CERTIFICATE"

[[files]]
  guest_path = "/run/secrets/bridge/cosign/private-key.pem"
  secret_name = "BRIDGE_COSIGN_PRIVATE_KEY"

[[files]]
  guest_path = "/run/secrets/bridge/cosign/operators.json"
  secret_name = "BRIDGE_OPERATOR_INVENTORY"

[[files]]
  guest_path = "/run/secrets/bridge/cosign/membership.json"
  secret_name = "BRIDGE_APPROVED_MEMBERSHIP"

[[mounts]]
  source = "bridge_relayer_1_data"
  destination = "/data"
  initial_size = "10gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
  cpu_kind = "shared"
