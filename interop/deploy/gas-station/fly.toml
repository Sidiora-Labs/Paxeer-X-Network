# The gas station at chain.paxeer.network: paxeer-gas-station of
# interop/crates/layerx-gas-station on one machine, because its sponsor nonce
# and its journal under /data/gas-station have one writer. docker/gas-station
# renders the station configuration from this env plus the app's secrets:
# GAS_STATION_RELAYER_KEY (the sponsor account's key), GAS_STATION_PAYMASTER
# (the deployed BatchCallAndSponsor), GAS_STATION_MAX_RATE_AGE (the owner's
# rate refresh interval) and the owner's station policy
# (GAS_STATION_MARGIN_BPS, GAS_STATION_PER_QUOTE_LIMIT,
# GAS_STATION_PER_ACCOUNT_LIMIT, GAS_STATION_PER_INTERVAL_LIMIT,
# GAS_STATION_INTERVAL_SECONDS, GAS_STATION_BALANCE_FLOOR,
# GAS_STATION_GAS_LIMIT, GAS_STATION_MAX_PRIORITY_FEE_PER_GAS), plus the rate
# publisher's GAS_STATION_RATE_OWNER_KEY (the paymaster owner's key, never the
# sponsor key), GAS_STATION_RATE_GAS_BUDGET_PER_DAY (gas units per chain day)
# and GAS_STATION_RATE_BALANCE_FLOOR (PAX base units), with the fee per gas
# ceiling of a publication in wei, GAS_STATION_RATE_MAX_FEE_PER_GAS, set in
# [env] below; the init refuses to start while any is missing. The machine runs two processes over the one
# volume: the station, unchanged, and the rate publisher
# (paxeer-gas-station rate), which signs setRate from the owner key every
# GAS_STATION_RATE_CADENCE_SECONDS, strictly below max_rate_age, from the
# owner's rate file /data/gas-station/rate.toml and journals each
# publication in /data/gas-station/rate.jsonl. They share the volume and the
# single writer of each journal, so they run under the init of the one
# machine rather than as Fly process groups, which each get their own machines
# and volumes. The image is built from the
# repository root and deployed with --image (flyctl resolves [build] paths
# against this directory).
app = "paxeer-gas-station"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../../../docker/gas-station/Dockerfile"

[deploy]
  strategy = "immediate"

[env]
  GAS_STATION_LISTEN = "[::]:8080"
  GAS_STATION_CHAIN_ID = "125"
  GAS_STATION_ENDPOINTS = "https://api-mainnet-beta.paxeer.network/rpc https://api4.mainnet-beta.paxeer.network https://api5.mainnet-beta.paxeer.network"
  GAS_STATION_TOKEN = "0x21f7b20a555199fa73A238B1a91FD0f549068fEe"
  GAS_STATION_DECIMALS = "6"
  GAS_STATION_SPREAD_BPS = "500"
  GAS_STATION_RELAYER_KEY_ENV = "GAS_STATION_RELAYER_KEY"
  GAS_STATION_RATE_CADENCE_SECONDS = "120"
  GAS_STATION_RATE_MAX_FEE_PER_GAS = "2000000000"

[[mounts]]
  source = "gas_station_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 14

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

[checks]
  [checks.listening]
    type = "tcp"
    port = 8080
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
  cpu_kind = "shared"
