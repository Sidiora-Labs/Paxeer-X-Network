[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is a compile-time proc macro inside the pinned vendored engine tree" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
exceptions = []

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
deny = [
    { name = "bindgen", reason = "Private C layouts may not cross the node boundary" },
    { name = "libsqlite3-sys", reason = "The human plane may not open node projections" },
    { name = "rusqlite", reason = "The human plane may not open node projections" },
    { name = "sqlx-sqlite", reason = "The human plane may not open node projections" },
    { name = "ctor", reason = "Process-wide initialisation is forbidden" },
    { name = "inventory", reason = "Process-wide registries are forbidden" },
]
skip = [
    { name = "getrandom", version = "=0.2.17" },
    { name = "syn", version = "=2.0.119" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
