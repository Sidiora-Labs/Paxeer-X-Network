name: Bug Report
description: Report a defect in PerfDB
labels: [bug, triage]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal code or command sequence that triggers the issue.
      render: rust
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PerfDB version / commit
    validations:
      required: true

  - type: input
    id: rustc
    attributes:
      label: rustc --version
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
