server_name: $RAILWAY_SERVICE_NAME
host: "::"
port: 4222
http_port: 8222
max_payload: 1048576

jetstream {
  store_dir: /data
  max_file_store: $NATS_MAX_FILE_STORE
}

cluster {
  name: perps-data
  host: "::"
  port: 6222
  authorization {
    user: perps-route
    password: $NATS_CLUSTER_PASSWORD
  }
  routes: $NATS_ROUTES
}

accounts {
  PERPS {
    jetstream: enabled
    users: [
      {
        user: perps-indexer
        password: $NATS_INDEXER_PASSWORD
        permissions: {
          publish: { allow: ["perps.>", "$JS.API.>"] }
          subscribe: { allow: ["_INBOX.>"] }
        }
      }
      {
        user: perps-gateway
        password: $NATS_GATEWAY_PASSWORD
        permissions: {
          publish: { allow: ["$JS.API.INFO", "$JS.API.STREAM.INFO.PERPS_V1", "$JS.API.CONSUMER.CREATE.PERPS_V1.>", "$JS.API.CONSUMER.MSG.NEXT.PERPS_V1.>", "$JS.API.CONSUMER.INFO.PERPS_V1.>", "$JS.API.CONSUMER.DELETE.PERPS_V1.>"] }
          subscribe: { allow: ["perps.>", "_INBOX.>"] }
        }
      }
    ]
  }
}
