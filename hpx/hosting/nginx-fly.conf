# The hpx registry vhost of hpx/hosting/nginx.conf for the Fly app of
# hpx/hosting/fly.toml: the Fly edge terminates TLS and forwards to this plain
# listener, and the client address comes from its Fly-Client-IP header.
limit_req_zone $binary_remote_addr zone=hpx_register:10m rate=10r/m;

upstream hpx_registry {
    server 127.0.0.1:8099;
    keepalive 16;
}

server {
    listen [::]:8080 ipv6only=off default_server;
    server_name node.hyperpaxeer.com;

    # ponytail: trusts Fly-Client-IP from any peer, since only the Fly proxy and the private network reach 8080; narrow to the proxy range if the app joins a shared network.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header Fly-Client-IP;

    client_max_body_size 64k;

    location = / {
        root /var/www/hpx;
        try_files /index.html =404;
    }

    location = /paxeer-logo.png {
        root /var/www/hpx;
        try_files $uri =404;
        expires 30d;
    }

    location ~ ^/fonts/(?:LTWave-(?:Light|Regular|Medium|Bold)|LTWaveMono-(?:Regular|Medium))\.otf$ {
        root /var/www/hpx;
        try_files $uri =404;
        default_type font/otf;
        expires 30d;
    }

    location /fonts/ {
        return 404;
    }

    location = /api/register {
        limit_req zone=hpx_register burst=5 nodelay;
        proxy_pass http://hpx_registry;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://hpx_registry;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 10m;
        send_timeout 10m;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    access_log /dev/stdout;
    error_log /dev/stderr;
}
