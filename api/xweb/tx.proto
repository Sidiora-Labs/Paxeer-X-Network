syntax = "proto3";
package paxprotocol.paxchain.xweb;

import "gogoproto/gogo.proto";

option go_package = "github.com/Sidiora-Labs/Paxeer-X-Network/modules/xweb/types";

// Msg defines the xweb module's gRPC message service. Every message is
// executed only for the module's authority; a request, a fulfilment and a
// refund are deliberately absent, because they enter only through the xweb
// precompile.
service Msg {
  rpc RegisterAttestor(MsgRegisterAttestor) returns (MsgRegisterAttestorResponse);
  rpc RemoveAttestor(MsgRemoveAttestor) returns (MsgRemoveAttestorResponse);
  rpc SetThreshold(MsgSetThreshold) returns (MsgSetThresholdResponse);
  rpc SetParams(MsgSetParams) returns (MsgSetParamsResponse);
  rpc Pause(MsgPause) returns (MsgPauseResponse);
  rpc Unpause(MsgUnpause) returns (MsgUnpauseResponse);
}

// Attestor is one web attestor: the EVM address its secp256k1 signatures
// recover to, the bank account its share of each fee is paid to and, for an
// attestor that accepts api credential envelopes, the 33-byte compressed
// public key of the same secp256k1 key. Its Go type is the module's state
// type, so a registered attestor is stored exactly as it was proposed.
message Attestor {
  option (gogoproto.typedecl) = false;
  option (gogoproto.goproto_getters) = false;
  option (gogoproto.goproto_stringer) = false;

  bytes signer = 1 [(gogoproto.customtype) = "Address20", (gogoproto.nullable) = false];
  string payout = 2;
  bytes public_key = 3;
}

// MsgRegisterAttestor adds one attestor to the set. Authority only.
message MsgRegisterAttestor {
  option (gogoproto.goproto_stringer) = false;

  string authority = 1;
  Attestor attestor = 2 [(gogoproto.nullable) = false];
}

// MsgRegisterAttestorResponse is the MsgRegisterAttestor response.
message MsgRegisterAttestorResponse {}

// MsgRemoveAttestor removes the registered attestor with this signer.
// Authority only.
message MsgRemoveAttestor {
  option (gogoproto.goproto_stringer) = false;

  string authority = 1;
  bytes signer = 2 [(gogoproto.customtype) = "Address20", (gogoproto.nullable) = false];
}

// MsgRemoveAttestorResponse is the MsgRemoveAttestor response.
message MsgRemoveAttestorResponse {}

// MsgSetThreshold sets the number of distinct attestor signatures a fulfilment
// needs. Authority only.
message MsgSetThreshold {
  option (gogoproto.goproto_stringer) = false;

  string authority = 1;
  uint32 threshold = 2;
}

// MsgSetThresholdResponse is the MsgSetThreshold response.
message MsgSetThresholdResponse {}

// MsgSetParams sets the fee a request pays, the payload and callback caps and
// the timeout in blocks after which an unfulfilled request is refundable. The
// authority itself is unchanged. Authority only.
message MsgSetParams {
  option (gogoproto.goproto_stringer) = false;

  string authority = 1;
  string fee = 2 [
    (gogoproto.customtype) = "github.com/Sidiora-Labs/Paxeer-X-Network/sdk/types.Int",
    (gogoproto.nullable) = false
  ];
  uint32 max_payload_bytes = 3;
  uint64 max_callback_gas = 4;
  uint64 timeout_blocks = 5;
}

// MsgSetParamsResponse is the MsgSetParams response.
message MsgSetParamsResponse {}

// MsgPause stops every request and fulfilment; refunds stay open. Authority
// only.
message MsgPause {
  option (gogoproto.goproto_stringer) = false;

  string authority = 1;
}

// MsgPauseResponse is the MsgPause response.
message MsgPauseResponse {}

// MsgUnpause resumes requests and fulfilments. Authority only.
message MsgUnpause {
  option (gogoproto.goproto_stringer) = false;

  string authority = 1;
}

// MsgUnpauseResponse is the MsgUnpause response.
message MsgUnpauseResponse {}
