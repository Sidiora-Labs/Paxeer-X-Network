syntax = "proto3";
package paxprotocol.paxchain.layerxgov;
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/any.proto";
option go_package = "github.com/sidiora-labs/paxeer-network/modules/layerxgov/types";
message LayerXProposal {
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;
  option (gogoproto.goproto_stringer) = false;
  string title = 1;
  string description = 2;
  repeated google.protobuf.Any messages = 3 [(cosmos_proto.accepts_interface) = "sdk.Msg"];
}
