services:
  api:
    image: ${API_IMAGE:?immutable service image required}
    build:
      context: ../..
      dockerfile: deploy/launchpad/Dockerfile.svc
      args: { SERVICE: api, BIN: apid }
    env_file: ["${API_ENV_FILE:?reviewed service environment required}"]
    environment:
      NODE_ENV: production
      RUNTIME_PROFILE: container
      BIND_ADDRESS: 0.0.0.0
      PORT: "8080"
      SECRETS_PROVIDER: env
      SECRETS_REFRESH_SECONDS: "30"
      API_ROLE: rest
    volumes:
      - ${API_EVIDENCE_DIR:?reviewed startup documents required}:/run/kindle:ro
    read_only: true
    tmpfs: [/tmp]
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
