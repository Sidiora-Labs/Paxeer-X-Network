app = "paxeer-shared-endpoint"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "docker/platform-gateway/Dockerfile"

[env]
  LAYERX_GATEWAY_LXP_WIRE_VERSION = "3"
  LAYERX_GATEWAY_IDEMPOTENCY_SECONDS = "604800"
  LAYERX_GATEWAY_LISTENER = "plain"
  LAYERX_GATEWAY_OUTBOUND_CA_DER = "/run/secrets/ca.crt.der"
  LAYERX_GATEWAY_REDIS_USERNAME_FILE = "/run/secrets/redis-username"
  LAYERX_GATEWAY_REDIS_PASSWORD_FILE = "/run/secrets/redis-password"
  LAYERX_EVENTS_PAYMENT_UPSTREAM_URL = "https://payments.process.paxeer-internal.internal:9443"
  LAYERX_EVENTS_PAYMENT_UPSTREAM_CA_DER = "/run/secrets/ca.crt.der"
  LAYERX_EVENTS_PAYMENT_UPSTREAM_TOKEN_FILE = "/run/secrets/events-payment-token"
  LAYERX_EVENTS_PAYMENT_UPSTREAM_CLIENT_IDENTITY_PKCS12 = "/run/secrets/events-client.p12"
  LAYERX_EVENTS_PAYMENT_UPSTREAM_CLIENT_IDENTITY_PASSWORD_FILE = "/run/secrets/events-client-password"
  LAYERX_EVENTS_WEBHOOKS_UPSTREAM_URL = "https://ingress.process.paxeer-webhooks.internal"
  LAYERX_EVENTS_WEBHOOKS_UPSTREAM_CA_DER = "/run/secrets/ca.crt.der"
  LAYERX_EVENTS_WEBHOOKS_UPSTREAM_TOKEN_FILE = "/run/secrets/events-webhooks-token"
  LAYERX_EVENTS_WEBHOOKS_UPSTREAM_CLIENT_IDENTITY_PKCS12 = "/run/secrets/events-client.p12"
  LAYERX_EVENTS_WEBHOOKS_UPSTREAM_CLIENT_IDENTITY_PASSWORD_FILE = "/run/secrets/events-client-password"
  LAYERX_GATEWAY_COMPONENT_URL = "https://paxeer-human-service.internal:9446"
  LAYERX_GATEWAY_AUTHORITY_URL = "https://paxeer-human-service.internal:9445"
  LAYERX_GATEWAY_PUBLIC_CORE_URL = "https://paxeer-human-service.internal:9443"
  LAYERX_GATEWAY_IDENTITY_URL = "https://paxeer-identity.internal:9443"
  LAYERX_GATEWAY_PROGRAM_REGISTRY_URL = "https://paxeer-registry.internal:9420"
  LAYERX_GATEWAY_CLIENT_IDENTITY_PKCS12 = "/run/secrets/client.p12"
  LAYERX_GATEWAY_CLIENT_IDENTITY_PASSWORD_FILE = "/run/secrets/client-password"
  LAYERX_GATEWAY_COMPONENT_TOKEN_FILE = "/run/secrets/component-token"
  LAYERX_GATEWAY_AUTHORITY_TOKEN_FILE = "/run/secrets/authority-token"
  LAYERX_GATEWAY_IDENTITY_TOKEN_FILE = "/run/secrets/identity-token"
  LAYERX_GATEWAY_IDENTITY_PROVISIONING_TOKEN_FILE = "/run/secrets/identity-provisioning-token"
  LAYERX_GATEWAY_PROGRAM_REGISTRY_TOKEN_FILE = "/run/secrets/program-registry-token"
  LAYERX_GATEWAY_SEQUENCER_PUBLIC_KEY_FILE = "/run/secrets/sequencer-public-key"
  LAYERX_GATEWAY_SEQUENCER_ID_FILE = "/run/secrets/sequencer-id"
  LAYERX_GATEWAY_SEQUENCER_FIRST_BATCH_FILE = "/run/secrets/sequencer-first-batch"
  LAYERX_GATEWAY_SEQUENCER_LAST_BATCH_FILE = "/run/secrets/sequencer-last-batch"
  LAYERX_GATEWAY_KEY_PROVISIONING_KEY_FILE = "/run/secrets/key-provisioning-key"
  LAYERX_GATEWAY_MODULE_REGISTRY_FILE = "/run/secrets/module-registry.json"
  LAYERX_GATEWAY_PROGRAM_REGISTRY_TOKEN_FILE = "/run/secrets/program-registry-token"

[[files]]
  guest_path = "/run/secrets/ca.crt.der"
  secret_name = "ENDPOINT_OUTBOUND_CA"

[[files]]
  guest_path = "/run/secrets/redis-username"
  secret_name = "ENDPOINT_REDIS_USERNAME"

[[files]]
  guest_path = "/run/secrets/redis-password"
  secret_name = "ENDPOINT_REDIS_PASSWORD"

# The payment event producer: the payments event source of the internal app
# and the webhooks ingress, both verified against the internal CA root of
# ENDPOINT_OUTBOUND_CA, with the gateway-client identity of tools/bringup/ca.sh.
[[files]]
  guest_path = "/run/secrets/events-client.p12"
  secret_name = "ENDPOINT_CLIENT_P12"

[[files]]
  guest_path = "/run/secrets/events-client-password"
  secret_name = "ENDPOINT_CLIENT_PASSWORD"

[[files]]
  guest_path = "/run/secrets/events-payment-token"
  secret_name = "ENDPOINT_EVENTS_PAYMENT_TOKEN"

[[files]]
  guest_path = "/run/secrets/events-webhooks-token"
  secret_name = "ENDPOINT_EVENTS_WEBHOOKS_TOKEN"

[[files]]
  guest_path = "/run/secrets/client.crt"
  secret_name = "ENDPOINT_CLIENT_CERT"

[[files]]
  guest_path = "/run/secrets/client.p12"
  secret_name = "ENDPOINT_CLIENT_P12"

[[files]]
  guest_path = "/run/secrets/client-password"
  secret_name = "ENDPOINT_CLIENT_PASSWORD"

[[files]]
  guest_path = "/run/secrets/component-token"
  secret_name = "ENDPOINT_COMPONENT_TOKEN"

[[files]]
  guest_path = "/run/secrets/authority-token"
  secret_name = "ENDPOINT_AUTHORITY_TOKEN"

[[files]]
  guest_path = "/run/secrets/identity-token"
  secret_name = "ENDPOINT_IDENTITY_TOKEN"

[[files]]
  guest_path = "/run/secrets/identity-provisioning-token"
  secret_name = "ENDPOINT_IDENTITY_PROVISIONING_TOKEN"

[[files]]
  guest_path = "/run/secrets/program-registry-token"
  secret_name = "ENDPOINT_PROGRAM_REGISTRY_TOKEN"

[[files]]
  guest_path = "/run/secrets/sequencer-public-key"
  secret_name = "ENDPOINT_SEQUENCER_PUBLIC_KEY"

[[files]]
  guest_path = "/run/secrets/sequencer-id"
  secret_name = "ENDPOINT_SEQUENCER_ID"

[[files]]
  guest_path = "/run/secrets/sequencer-first-batch"
  secret_name = "ENDPOINT_SEQUENCER_FIRST_BATCH"

[[files]]
  guest_path = "/run/secrets/sequencer-last-batch"
  secret_name = "ENDPOINT_SEQUENCER_LAST_BATCH"

[[files]]
  guest_path = "/run/secrets/key-provisioning-key"
  secret_name = "ENDPOINT_KEY_PROVISIONING_KEY"

[[files]]
  guest_path = "/run/secrets/module-registry.json"
  secret_name = "ENDPOINT_MODULE_REGISTRY"

[[files]]
  guest_path = "/run/secrets/program-registry-token"
  secret_name = "ENDPOINT_PROGRAM_REGISTRY_TOKEN"

[http_service]
  internal_port = 9443
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 2

  [http_service.concurrency]
    type = "requests"
    soft_limit = 1000
    hard_limit = 1200

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/readyz"
    protocol = "http"

[[vm]]
  size = "performance-4x"
  memory = "8gb"
  cpus = 4
  cpu_kind = "performance"
