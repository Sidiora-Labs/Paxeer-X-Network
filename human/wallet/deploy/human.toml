app = "paxeer-human-service"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "docker/kernel/Dockerfile"

[deploy]
  strategy = "immediate"

[env]
  LAYERX_NODE_NETWORK_ID = "125"
  LAYERX_HUMAN_LISTENER = "plain"
  LAYERX_HUMAN_BIND = "[::]:8080"
  LAYERX_HUMAN_COMPONENT_SOCKET = "/run/layerx/human/components.sock"
  LAYERX_HUMAN_WEB_ORIGIN = "https://app.paxportwallet.com,https://paxportwallet.com,https://www.paxportwallet.com,https://paxport-production.up.railway.app"
  LAYERX_HUMAN_REQUESTS_PER_MINUTE = "240"
  LAYERX_HUMAN_MAX_PRINCIPALS = "100000"
  LAYERX_HUMAN_MAX_HEADER_BYTES = "32768"
  LAYERX_HUMAN_MAX_BODY_BYTES = "1048576"
  LAYERX_HUMAN_MAX_CONNECTIONS = "1024"
  LAYERX_HUMAN_IO_DEADLINE_SECONDS = "15"
  LAYERX_HUMAN_RP_ID = "paxportwallet.com"
  LAYERX_KERNEL_PAXEER_RPC_NAMES = "api1.mainnet-beta.paxeer.network api12.mainnet-beta.paxeer.network"
  LAYERX_EVENTS_JOURNEY_UPSTREAM_URL = "https://journeys.process.paxeer-internal.internal:9443"
  LAYERX_EVENTS_JOURNEY_UPSTREAM_CA_DER = "/data/tls/human-event-client/ca.der"
  LAYERX_EVENTS_JOURNEY_UPSTREAM_TOKEN_FILE = "/run/secrets/events-journey-token"
  LAYERX_EVENTS_JOURNEY_UPSTREAM_CLIENT_IDENTITY_PKCS12 = "/data/tls/human-event-client/identity.p12"
  LAYERX_EVENTS_JOURNEY_UPSTREAM_CLIENT_IDENTITY_PASSWORD_FILE = "/data/tls/human-event-client/password"
  LAYERX_EVENTS_APPROVAL_UPSTREAM_URL = "https://approvals.process.paxeer-internal.internal:9443"
  LAYERX_EVENTS_APPROVAL_UPSTREAM_CA_DER = "/data/tls/human-event-client/ca.der"
  LAYERX_EVENTS_APPROVAL_UPSTREAM_TOKEN_FILE = "/run/secrets/events-approval-token"
  LAYERX_EVENTS_APPROVAL_UPSTREAM_CLIENT_IDENTITY_PKCS12 = "/data/tls/human-event-client/identity.p12"
  LAYERX_EVENTS_APPROVAL_UPSTREAM_CLIENT_IDENTITY_PASSWORD_FILE = "/data/tls/human-event-client/password"
  LAYERX_EVENTS_WEBHOOKS_UPSTREAM_URL = "https://ingress.process.paxeer-webhooks.internal"
  LAYERX_EVENTS_WEBHOOKS_UPSTREAM_CA_DER = "/data/tls/human-event-client/ca.der"
  LAYERX_EVENTS_WEBHOOKS_UPSTREAM_TOKEN_FILE = "/run/secrets/events-webhooks-token"
  LAYERX_EVENTS_WEBHOOKS_UPSTREAM_CLIENT_IDENTITY_PKCS12 = "/data/tls/human-event-client/identity.p12"
  LAYERX_EVENTS_WEBHOOKS_UPSTREAM_CLIENT_IDENTITY_PASSWORD_FILE = "/data/tls/human-event-client/password"

# The full kernel profile of docker/kernel/init.sh refuses to start without
# four more values the repo does not define; each is a deploy input set as a
# Fly secret of this app (fly secrets set, read as env):
#   LAYERX_NODE_NETWORK_NAME                     the network name the kernel genesis names, the router's LAYERX_GATEWAY_NETWORK_ID
#   LAYERX_KERNEL_AGENTD_RPC_PEER                the DNS name of the gateway client certificate agentd admits on 9454
#   LAYERX_KERNEL_AGENTD_RPC_DAEMON_SEQUENCES    agentd idempotency retention in daemon sequences, positive integer
#   LAYERX_KERNEL_AGENTD_RPC_PROTOCOL_SEQUENCES  agentd idempotency retention in protocol sequences, at most the daemon value

[[files]]
  guest_path = "/etc/layerx/trust/ca.crt"
  secret_name = "LAYERX_INTERNAL_CA_ROOT"

# The journey and approval event producers of the human components: their
# client identity and internal CA root are the human-event-client identity
# tools/bringup/ca.sh issues on the volume; the producer tokens of the two event
# sources and the webhooks source trigger token are Fly secrets.
[[files]]
  guest_path = "/run/secrets/events-journey-token"
  secret_name = "HUMAN_EVENTS_JOURNEY_TOKEN"

[[files]]
  guest_path = "/run/secrets/events-approval-token"
  secret_name = "HUMAN_EVENTS_APPROVAL_TOKEN"

[[files]]
  guest_path = "/run/secrets/events-webhooks-token"
  secret_name = "HUMAN_EVENTS_WEBHOOKS_TOKEN"

[[mounts]]
  source = "kernel_data"
  destination = "/data"
  initial_size = "50gb"
  scheduled_snapshots = true
  snapshot_retention = 14

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 2

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/livez"
    protocol = "http"

# agentd at machine.paxeer.network:9454: the edge passes the name through
# unchanged to the dedicated IPv4 of this app (fly ips allocate-v4).
[[services]]
  internal_port = 9454
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 2

  [[services.ports]]
    port = 9454

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "performance-4x"
  memory = "16gb"
  cpus = 4
  cpu_kind = "performance"
