app = "paxeer-human-service"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "docker/kernel/Dockerfile"

[deploy]
  strategy = "immediate"

[env]
  LAYERX_HUMAN_LISTENER = "plain"
  LAYERX_HUMAN_BIND = "[::]:8080"
  LAYERX_HUMAN_COMPONENT_SOCKET = "/run/layerx/human/components.sock"
  LAYERX_HUMAN_WEB_ORIGIN = "https://app.paxportwallet.com,https://paxportwallet.com,https://www.paxportwallet.com,https://paxport-production.up.railway.app"
  LAYERX_HUMAN_REQUESTS_PER_MINUTE = "240"
  LAYERX_HUMAN_MAX_PRINCIPALS = "100000"
  LAYERX_HUMAN_MAX_HEADER_BYTES = "32768"
  LAYERX_HUMAN_MAX_BODY_BYTES = "1048576"
  LAYERX_HUMAN_MAX_CONNECTIONS = "1024"
  LAYERX_HUMAN_IO_DEADLINE_SECONDS = "15"

[[files]]
  guest_path = "/etc/layerx/trust/ca.crt"
  secret_name = "LAYERX_INTERNAL_CA_ROOT"

[[mounts]]
  source = "kernel_data"
  destination = "/data"
  initial_size = "50gb"
  scheduled_snapshots = true
  snapshot_retention = 14

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/livez"
    protocol = "http"

[[services]]
  internal_port = 9454
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 9454

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "performance-4x"
  memory = "16gb"
  cpus = 4
  cpu_kind = "performance"
