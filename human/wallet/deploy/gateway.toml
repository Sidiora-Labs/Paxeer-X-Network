app = "paxeer-wallet-gateway"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "human/wallet/gateway/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HYPERPAXEER_CHAIN_ID = "125"
  SPONSOR_PRIVATE_KEY_FILE = "/run/secrets/sponsor_private_key"
  ATTESTOR_ENDPOINTS = "https://paxeer-attestor-1.internal:8443,https://paxeer-attestor-2.internal:8443,https://paxeer-attestor-3.internal:8443,https://paxeer-attestor-4.internal:8443,https://paxeer-attestor-5.internal:8443"
  ATTESTOR_CLIENT_CERT_FILE = "/run/secrets/attestor_client.crt"
  ATTESTOR_CLIENT_KEY_FILE = "/run/secrets/attestor_client.key"
  ATTESTOR_CA_FILE = "/run/secrets/attestor_ca.crt"
  ATTESTOR_QUORUM = "3"

[[files]]
  guest_path = "/run/secrets/sponsor_private_key"
  secret_name = "SPONSOR_PRIVATE_KEY"

[[files]]
  guest_path = "/run/secrets/attestor_client.crt"
  secret_name = "ATTESTOR_CLIENT_CERT"

[[files]]
  guest_path = "/run/secrets/attestor_client.key"
  secret_name = "ATTESTOR_CLIENT_KEY"

[[files]]
  guest_path = "/run/secrets/attestor_ca.crt"
  secret_name = "ATTESTOR_CA"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 2

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/readyz"

[[vm]]
  size = "performance-2x"
  memory = "4gb"
  cpus = 2
  cpu_kind = "performance"
