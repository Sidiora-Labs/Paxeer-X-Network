app = "paxeer-wallet-gateway"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "human/wallet/gateway/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  SPONSOR_PRIVATE_KEY_FILE = "/run/secrets/sponsor_private_key"

[[files]]
  guest_path = "/run/secrets/sponsor_private_key"
  secret_name = "SPONSOR_PRIVATE_KEY"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
  cpu_kind = "shared"
