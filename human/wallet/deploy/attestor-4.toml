app = "paxeer-attestor-4"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "docker/wallet-attestor/Dockerfile"

[deploy]
  strategy = "immediate"

[env]
  ATTESTOR_NODE_ID = "4"
  ATTESTOR_REGION = "fra"
  ATTESTOR_LISTEN_ADDR = ":8443"
  ATTESTOR_PEER_LISTEN_ADDR = ":9443"
  ATTESTOR_PEERS = "1=paxeer-attestor-1.internal:9443,2=paxeer-attestor-2.internal:9443,3=paxeer-attestor-3.internal:9443,5=paxeer-attestor-5.internal:9443"
  ATTESTOR_DATA_DIR = "/data"
  ATTESTOR_BACKUP_DIR = "/data/backup"
  ATTESTOR_SNAPSHOT_INTERVAL = "15m"
  ATTESTOR_SNAPSHOT_RETAIN = "96"
  ATTESTOR_CHAIN_ID = "125"
  ATTESTOR_CEREMONY = "false"
  ATTESTOR_JWT_AUDIENCE = "authenticated"
  ATTESTOR_POLICY_FILE = "/etc/attestor/policy.json"
  ATTESTOR_KERNEL_POLICY_FILE = "/etc/attestor/kernel-policy.json"
  ATTESTOR_ACTIVITY_TYPES = "0x10005,0x10007,0x30002,0x90005"
  ATTESTOR_JWT_MAX_AGE = "1h"
  ATTESTOR_NODE_KEY_FILE = "/run/secrets/node.key"
  ATTESTOR_BACKUP_KEY_FILE = "/run/secrets/backup.key"
  ATTESTOR_TLS_CERT_FILE = "/run/secrets/tls.crt"
  ATTESTOR_TLS_KEY_FILE = "/run/secrets/tls.key"
  ATTESTOR_TLS_CA_FILE = "/run/secrets/ca.crt"
  ATTESTOR_OPERATOR_CA_FILE = "/run/secrets/operator-ca.crt"
  ATTESTOR_AUTHORITY_PUBLIC_KEY_FILE = "/run/secrets/wallet_identity_binding_public.pem"
  ATTESTOR_INVENTORY_PUBLIC_KEY_FILE = "/run/secrets/wallet_custody_inventory_authority.pem"
  ATTESTOR_INVENTORY_FILE = "/run/secrets/wallet_custody_inventory.jwt"
  ATTESTOR_REPLICA_KEY_FILE = "/run/secrets/replica.key"
  ATTESTOR_REPLICA_HOST_KEY_FILE = "/run/secrets/replica-host.pub"
  ATTESTOR_REPLICA_REMOTE_DIR = "/attestor-4"
  ATTESTOR_REPLICA_INTERVAL = "5m"

[[files]]
  guest_path = "/etc/attestor/policy.json"
  local_path = "attestor-policy.json"

[[files]]
  guest_path = "/etc/attestor/kernel-policy.json"
  local_path = "attestor-kernel-policy.json"

[[files]]
  guest_path = "/run/secrets/node.key"
  secret_name = "ATTESTOR_NODE_KEY"

[[files]]
  guest_path = "/run/secrets/backup.key"
  secret_name = "ATTESTOR_BACKUP_KEY"

[[files]]
  guest_path = "/run/secrets/tls.crt"
  secret_name = "ATTESTOR_TLS_CERT"

[[files]]
  guest_path = "/run/secrets/tls.key"
  secret_name = "ATTESTOR_TLS_KEY"

[[files]]
  guest_path = "/run/secrets/ca.crt"
  secret_name = "ATTESTOR_TLS_CA"

[[files]]
  guest_path = "/run/secrets/operator-ca.crt"
  secret_name = "ATTESTOR_OPERATOR_CA"

[[files]]
  guest_path = "/run/secrets/replica.key"
  secret_name = "ATTESTOR_REPLICA_KEY"

[[files]]
  guest_path = "/run/secrets/replica-host.pub"
  secret_name = "ATTESTOR_REPLICA_HOST_KEY"

[[files]]
  guest_path = "/run/secrets/wallet_identity_binding_public.pem"
  secret_name = "WALLET_IDENTITY_BINDING_PUBLIC_KEY"
  mode = 384

[[files]]
  guest_path = "/run/secrets/wallet_custody_inventory_authority.pem"
  secret_name = "WALLET_CUSTODY_INVENTORY_PUBLIC_KEY"
  mode = 384

[[files]]
  guest_path = "/run/secrets/wallet_custody_inventory.jwt"
  secret_name = "WALLET_CUSTODY_INVENTORY"
  mode = 384

[[mounts]]
  source = "attestor_data"
  destination = "/data"
  initial_size = "10gb"

[[services]]
  protocol = "tcp"
  internal_port = 8443
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[services]]
  protocol = "tcp"
  internal_port = 9443
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "performance-2x"
  memory = "4gb"
  cpus = 2
  cpu_kind = "performance"
