"""
Indicates exactly one field must be supplied and this field must not be `null`.
"""
directive @oneOf on INPUT_OBJECT

scalar BigDecimal

scalar DateTime

  # ============================================================
  #  MARKET
  # ============================================================
  type Market {
    marketId: Int!
    name: String!
    symbol: String!
    maxLeverage: BigDecimal
    enabled: Boolean!
    createdAt: DateTime
    latestPrice: LatestPrice
    poolState: PoolState
    fundingRate: FundingRate
  }

  # ============================================================
  #  POSITION
  # ============================================================

  type Position {
    positionId: BigDecimal!
    userAddress: String!
    marketId: Int!
    isLong: Boolean!
    sizeUsd: BigDecimal!
    leverage: BigDecimal!
    entryPrice: BigDecimal!
    collateralToken: String
    collateralAmount: BigDecimal!
    collateralUsd: BigDecimal!
    status: String!
    realizedPnl: BigDecimal
    exitPrice: BigDecimal
    openedAt: DateTime
    closedAt: DateTime
    openBlock: Int
    closeBlock: Int
    openTxHash: String
    closeTxHash: String
    market: Market
  }

  # ============================================================
  #  TRADE
  # ============================================================

  type Trade {
    id: Int!
    positionId: BigDecimal!
    userAddress: String
    marketId: Int
    tradeType: String!
    isLong: Boolean
    sizeUsd: BigDecimal!
    price: BigDecimal!
    realizedPnl: BigDecimal
    feeUsd: BigDecimal
    blockNumber: Int!
    txHash: String!
    blockTimestamp: DateTime!
  }

  # ============================================================
  #  ORDER
  # ============================================================

  type Order {
    orderId: BigDecimal!
    userAddress: String!
    marketId: Int!
    orderType: Int!
    orderTypeName: String
    isLong: Boolean!
    triggerPrice: BigDecimal!
    sizeUsd: BigDecimal!
    status: String!
    positionId: BigDecimal
    executionPrice: BigDecimal
    failureReason: String
    placedAt: DateTime
    resolvedAt: DateTime
    placedBlock: Int
    resolvedBlock: Int
    placedTxHash: String
    resolvedTxHash: String
  }

  # ============================================================
  #  LIQUIDATION
  # ============================================================

  type Liquidation {
    id: Int!
    positionId: BigDecimal!
    userAddress: String!
    marketId: Int!
    price: BigDecimal!
    penalty: BigDecimal!
    keeper: String!
    blockNumber: Int!
    txHash: String!
    blockTimestamp: DateTime!
  }

  # ============================================================
  #  PRICE
  # ============================================================

  type PriceUpdate {
    id: Int!
    marketId: Int!
    price: BigDecimal!
    onchainTimestamp: Int!
    blockNumber: Int!
    txHash: String!
    blockTimestamp: DateTime!
  }

  type LatestPrice {
    marketId: Int!
    price: BigDecimal!
    onchainTimestamp: Int
    blockNumber: Int!
    updatedAt: DateTime
  }

  # ============================================================
  #  FUNDING
  # ============================================================

  type FundingRate {
    id: Int!
    marketId: Int!
    ratePerSecond: BigDecimal!
    rate24h: BigDecimal!
    blockNumber: Int!
    txHash: String!
    blockTimestamp: DateTime!
  }

  # ============================================================
  #  VAULT
  # ============================================================

  type UserVault {
    userAddress: String!
    vaultAddress: String!
    createdAt: DateTime
    blockNumber: Int
    txHash: String
  }

  type VaultEvent {
    id: Int!
    eventType: String!
    userAddress: String
    tokenAddress: String!
    amount: BigDecimal!
    blockNumber: Int!
    txHash: String!
    logIndex: Int!
    blockTimestamp: DateTime!
  }

  # ============================================================
  #  COLLATERAL
  # ============================================================

  type CollateralToken {
    tokenAddress: String!
    decimals: Int!
    isActive: Boolean!
    addedAt: DateTime
  }

  # ============================================================
  #  POOL STATE (vAMM)
  # ============================================================

  type PoolState {
    marketId: Int!
    baseReserve: BigDecimal
    quoteReserve: BigDecimal
    oraclePrice: BigDecimal
    updatedAt: DateTime
    blockNumber: Int
  }

  # ============================================================
  #  FEE CONFIG
  # ============================================================

  type FeeConfig {
    takerFeeBps: Int
    makerFeeBps: Int
    liquidationFeeBps: Int
    insuranceFeeBps: Int
    updatedAt: DateTime
  }

  # ============================================================
  #  PROTOCOL EVENT
  # ============================================================

  type ProtocolEvent {
    id: Int!
    eventName: String!
    eventData: String!
    blockNumber: Int!
    txHash: String!
    logIndex: Int!
    blockTimestamp: DateTime!
  }

  # ============================================================
  #  INDEXER STATE
  # ============================================================

  type IndexerStatus {
    lastIndexedBlock: Int!
    chainHead: Int
    blocksScanned: Int
    eventsProcessed: Int
    isSynced: Boolean
  }

  # ============================================================
  #  KEEPER CYCLE (V2)
  # ============================================================

  type KeeperCycle {
    id: Int!
    onchainTimestamp: Int!
    marketsUpdated: Int!
    ordersExecuted: Int!
    liquidationsExecuted: Int!
    ordersFailed: Int!
    liquidationsFailed: Int!
    blockNumber: Int!
    txHash: String!
    blockTimestamp: DateTime!
  }

  # ============================================================
  #  ACCOUNT LEDGER (V2 — TradingAccount)
  # ============================================================

  type AccountLedgerEntry {
    id: Int!
    entryId: BigDecimal!
    userAddress: String!
    entryType: Int!
    tokenAddress: String!
    amount: BigDecimal!
    positionId: BigDecimal!
    isDebit: Boolean!
    blockNumber: Int!
    txHash: String!
    blockTimestamp: DateTime!
  }

  # ============================================================
  #  DELEGATE (V2 — TradingAccount)
  # ============================================================

  type Delegate {
    id: Int!
    userAddress: String!
    delegateAddress: String!
    canTrade: Boolean!
    canWithdraw: Boolean!
    canModifyMargin: Boolean!
    expiry: BigDecimal!
    isActive: Boolean!
    blockNumber: Int!
    txHash: String!
    blockTimestamp: DateTime!
  }

  # ============================================================
  #  TRADING ACCOUNT EVENT (V2)
  # ============================================================

  type TradingAccountEvent {
    id: Int!
    eventType: String!
    userAddress: String!
    positionId: BigDecimal
    tokenAddress: String
    amount: BigDecimal
    extraData: String
    blockNumber: Int!
    txHash: String!
    blockTimestamp: DateTime!
  }

  # ============================================================
  #  V5 — FEE (FeeCollected)
  # ============================================================

  type Fee {
    id: Int!
    positionId: BigDecimal!
    userAddress: String!
    marketId: Int!
    feeType: Int!
    feeTypeName: String
    feeUsd: BigDecimal!
    feeTokens: BigDecimal!
    tokenAddress: String!
    blockNumber: Int!
    txHash: String!
    logIndex: Int!
    blockTimestamp: DateTime!
  }

  # ============================================================
  #  V5 — TRADE SETTLEMENT (TradeSettled)
  # ============================================================

  type TradeSettlement {
    id: Int!
    positionId: BigDecimal!
    userAddress: String!
    marketId: Int!
    tradeType: Int!
    tradeTypeName: String
    sizeUsd: BigDecimal!
    executionPrice: BigDecimal!
    grossPnl: BigDecimal!
    totalFeesUsd: BigDecimal!
    borrowingFeeUsd: BigDecimal!
    fundingPaidUsd: BigDecimal!
    netPayoutTokens: BigDecimal!
    blockNumber: Int!
    txHash: String!
    blockTimestamp: DateTime!
  }

  # ============================================================
  #  V5 — OI SNAPSHOT (OpenInterestChanged)
  # ============================================================

  type OiSnapshot {
    id: Int!
    marketId: Int!
    longOi: BigDecimal!
    shortOi: BigDecimal!
    deltaUsd: BigDecimal!
    isIncrease: Boolean!
    blockNumber: Int!
    txHash: String!
    blockTimestamp: DateTime!
  }

  # ============================================================
  #  V5 — MARK PRICE HISTORY (MarkPriceChanged)
  # ============================================================

  type MarkPriceRecord {
    id: Int!
    marketId: Int!
    markPrice: BigDecimal!
    indexPrice: BigDecimal!
    baseReserve: BigDecimal
    quoteReserve: BigDecimal
    blockNumber: Int!
    txHash: String!
    blockTimestamp: DateTime!
  }

  # ============================================================
  #  V5 — VAULT BALANCE HISTORY (VaultBalanceChanged)
  # ============================================================

  type VaultBalanceRecord {
    id: Int!
    tokenAddress: String!
    vaultType: Int!
    vaultTypeName: String
    newBalance: BigDecimal!
    delta: BigDecimal!
    isIncrease: Boolean!
    blockNumber: Int!
    txHash: String!
    blockTimestamp: DateTime!
  }

  # ============================================================
  #  V5 — FUNDING PAYMENT (PositionFundingApplied)
  # ============================================================

  type FundingPayment {
    id: Int!
    positionId: BigDecimal!
    userAddress: String!
    marketId: Int!
    fundingPaymentUsd: BigDecimal!
    newCollateralUsd: BigDecimal!
    newCollateralAmount: BigDecimal!
    blockNumber: Int!
    txHash: String!
    blockTimestamp: DateTime!
  }

  # ============================================================
  #  V5 — MARKET SNAPSHOT (MarketSnapshot)
  # ============================================================

  type MarketSnapshotRecord {
    id: Int!
    marketId: Int!
    longOi: BigDecimal!
    shortOi: BigDecimal!
    markPrice: BigDecimal!
    indexPrice: BigDecimal!
    fundingRatePerSecond: BigDecimal!
    fundingRate24h: BigDecimal!
    volume24hUsd: BigDecimal!
    onchainTimestamp: Int!
    blockNumber: Int!
    blockTimestamp: DateTime!
  }

  # ============================================================
  #  V5 — PROTOCOL SNAPSHOT (ProtocolSnapshot)
  # ============================================================

  type ProtocolSnapshotRecord {
    id: Int!
    totalPositions: BigDecimal!
    totalOpenPositions: BigDecimal!
    totalMarkets: BigDecimal!
    tvlUsd: BigDecimal!
    insuranceTotalUsd: BigDecimal!
    onchainTimestamp: Int!
    blockNumber: Int!
    blockTimestamp: DateTime!
  }

  # ============================================================
  #  AGGREGATES
  # ============================================================

  type UserStats {
    userAddress: String!
    totalPositions: Int!
    openPositions: Int!
    closedPositions: Int!
    liquidatedPositions: Int!
    totalTrades: Int!
    totalRealizedPnl: BigDecimal!
    totalOrders: Int!
    activeOrders: Int!
  }

  type MarketStats {
    marketId: Int!
    symbol: String
    totalPositions: Int!
    openPositions: Int!
    totalTrades: Int!
    totalLiquidations: Int!
    totalVolume: BigDecimal!
    latestPrice: BigDecimal
    latestFundingRate: BigDecimal
  }

  type GlobalStats {
    totalMarkets: Int!
    totalPositions: Int!
    openPositions: Int!
    totalTrades: Int!
    totalLiquidations: Int!
    totalVolume: BigDecimal!
    totalUsers: Int!
    indexerBlock: Int!
  }

  # ============================================================
  #  ENRICHED STATS (on-chain + Orderly)
  # ============================================================

  type OrderlyTicker {
    symbol: String!
    paxeerSymbol: String!
    mark_price: Float
    index_price: Float
    sum_unitary_funding: Float
    last_funding_rate_hourly: String
    last_funding_rate: Float
    next_funding_time: Float
    open_interest: Float
    h24_open: Float
    h24_close: Float
    h24_high: Float
    h24_low: Float
    h24_amount: Float
    h24_volume: Float
  }

  type OrderlyVolumeStats {
    perp_volume_ytd: Float
    perp_volume_ltd: Float
    perp_volume_today: Float
    perp_volume_last_1_day: Float
    perp_volume_last_7_days: Float
    perp_volume_last_30_days: Float
  }

  type OrderlyPriceChange {
    symbol: String!
    paxeerSymbol: String!
    last_price: Float
    change_5m: Float
    change_30m: Float
    change_1h: Float
    change_4h: Float
    change_24h: Float
    change_3d: Float
    change_7d: Float
    change_30d: Float
  }

  type OrderlyOpenInterest {
    symbol: String!
    paxeerSymbol: String!
    long_oi: Float
    short_oi: Float
  }

  type OrderlyFundingRate {
    symbol: String!
    paxeerSymbol: String!
    last_funding_rate_hourly: String
    last_funding_rate: Float
    last_funding_rate_timestamp: Float
    next_funding_time: Float
    sum_unitary_funding: Float
  }

  type EnrichedGlobalStats {
    onchain: GlobalStats!
    orderly: OrderlyVolumeStats
  }

  type EnrichedMarketStats {
    onchain: MarketStats!
    ticker: OrderlyTicker
    fundingRate: OrderlyFundingRate
    openInterest: OrderlyOpenInterest
    priceChange: OrderlyPriceChange
  }

  # ============================================================
  #  QUERIES
  # ============================================================

  type Query {
    # Positions
    position(positionId: String!): Position
    positions(
      userAddress: String
      marketId: Int
      status: String
      limit: Int
      offset: Int
    ): [Position!]!

    # Trades
    trades(
      userAddress: String
      marketId: Int
      positionId: String
      tradeType: String
      limit: Int
      offset: Int
    ): [Trade!]!

    # Orders
    order(orderId: String!): Order
    orders(
      userAddress: String
      marketId: Int
      status: String
      orderType: Int
      limit: Int
      offset: Int
    ): [Order!]!

    # Liquidations
    liquidations(
      userAddress: String
      marketId: Int
      limit: Int
      offset: Int
    ): [Liquidation!]!

    # Markets
    market(marketId: Int!): Market
    markets: [Market!]!

    # Prices
    latestPrices: [LatestPrice!]!
    priceHistory(
      marketId: Int!
      limit: Int
      offset: Int
    ): [PriceUpdate!]!

    # Funding
    fundingRates(
      marketId: Int!
      limit: Int
      offset: Int
    ): [FundingRate!]!

    # Vaults
    userVault(userAddress: String!): UserVault
    vaultEvents(
      userAddress: String
      eventType: String
      limit: Int
      offset: Int
    ): [VaultEvent!]!

    # Collateral
    collateralTokens: [CollateralToken!]!

    # Pool state
    poolStates: [PoolState!]!
    poolState(marketId: Int!): PoolState

    # Fees
    feeConfig: FeeConfig

    # Protocol events
    protocolEvents(
      eventName: String
      limit: Int
      offset: Int
    ): [ProtocolEvent!]!

    # Stats
    userStats(userAddress: String!): UserStats
    marketStats(marketId: Int!): MarketStats
    globalStats: GlobalStats
    indexerStatus: IndexerStatus

    # V2 — Keeper Cycles
    keeperCycles(limit: Int, offset: Int): [KeeperCycle!]!

    # V2 — Account Ledger
    accountLedger(
      userAddress: String
      positionId: String
      limit: Int
      offset: Int
    ): [AccountLedgerEntry!]!

    # V2 — Delegates
    delegates(userAddress: String!): [Delegate!]!

    # V2 — Trading Account Events
    tradingAccountEvents(
      userAddress: String
      eventType: String
      limit: Int
      offset: Int
    ): [TradingAccountEvent!]!

    # V5 — Fees
    fees(
      userAddress: String
      marketId: Int
      positionId: String
      feeType: Int
      limit: Int
      offset: Int
    ): [Fee!]!

    # V5 — Trade Settlements
    tradeSettlements(
      userAddress: String
      marketId: Int
      positionId: String
      tradeType: Int
      limit: Int
      offset: Int
    ): [TradeSettlement!]!

    # V5 — OI Snapshots
    oiSnapshots(
      marketId: Int!
      limit: Int
      offset: Int
    ): [OiSnapshot!]!

    # V5 — Mark Price History
    markPriceHistory(
      marketId: Int!
      limit: Int
      offset: Int
    ): [MarkPriceRecord!]!

    # V5 — Vault Balance History
    vaultBalanceHistory(
      tokenAddress: String
      vaultType: Int
      limit: Int
      offset: Int
    ): [VaultBalanceRecord!]!

    # V5 — Funding Payments
    fundingPayments(
      userAddress: String
      marketId: Int
      positionId: String
      limit: Int
      offset: Int
    ): [FundingPayment!]!

    # V5 — Market Snapshots
    marketSnapshots(
      marketId: Int!
      limit: Int
      offset: Int
    ): [MarketSnapshotRecord!]!

    # V5 — Protocol Snapshots
    protocolSnapshots(
      limit: Int
      offset: Int
    ): [ProtocolSnapshotRecord!]!

    # Enriched Stats (on-chain + Orderly)
    enrichedGlobalStats: EnrichedGlobalStats!
    enrichedMarketStats(marketId: Int!): EnrichedMarketStats!

    # Orderly market data via GraphQL
    orderlyTickers: [OrderlyTicker!]!
    orderlyFundingRates: [OrderlyFundingRate!]!
    orderlyPriceChanges: [OrderlyPriceChange!]!
    orderlyOpenInterests: [OrderlyOpenInterest!]!

    # ============================================================
    #  V4 SPOT TRADING
    # ============================================================

    # Spot markets — full registry
    spotMarket(marketId: String!): SpotMarket
    spotMarkets(status: String, limit: Int, offset: Int): [SpotMarket!]!

    # Spot orders
    spotOrder(orderId: String!): SpotOrder
    spotOrders(
      traderAddress: String
      marketId: String
      status: String
      limit: Int
      offset: Int
    ): [SpotOrder!]!

    # Spot fills (executed trades)
    spotOrderFills(
      orderId: String
      traderAddress: String
      marketId: String
      limit: Int
      offset: Int
    ): [SpotOrderFill!]!

    # Batch auction results
    spotBatchClearings(
      marketId: String
      limit: Int
      offset: Int
    ): [SpotBatchClearing!]!

    # Epoch settlements
    spotEpochSettlements(limit: Int, offset: Int): [SpotEpochSettlement!]!

    # Fast settlements
    spotFastSettlements(
      userAddress: String
      tokenAddress: String
      limit: Int
      offset: Int
    ): [SpotFastSettlement!]!

    # Collateral movements (spot deposits / withdrawals)
    spotCollateralMovements(
      userAddress: String
      tokenAddress: String
      eventType: String
      limit: Int
      offset: Int
    ): [SpotCollateralMovement!]!

    # Market mode-change audit log
    spotMarketModeChanges(
      marketId: String
      limit: Int
      offset: Int
    ): [SpotMarketModeChange!]!

    # PoFQ reputation updates
    spotPofqUpdates(
      entityAddress: String
      isVault: Boolean
      limit: Int
      offset: Int
    ): [SpotPofqUpdate!]!

    # Registered PLVs
    spotPLVs(isRegistered: Boolean, limit: Int, offset: Int): [SpotPLV!]!

    # Spot keeper cycle log
    spotKeeperCycles(limit: Int, offset: Int): [SpotKeeperCycle!]!

    # Spot batch clear failures
    spotBatchClearFailures(
      marketId: String
      limit: Int
      offset: Int
    ): [SpotBatchClearFailure!]!
  }

  # ============================================================
  #  V4 SPOT TRADING — TYPES
  # ============================================================

  type SpotMarket {
    marketId: String
    baseToken: String
    quoteToken: String
    mode: Int
    modeName: String
    status: String
    createdAt: DateTime
    createdBlock: Int
    createdTxHash: String
    lastModeChangedAt: DateTime
    lastModeChangeBlock: Int
    lastModeChangeTx: String
  }

  type SpotOrder {
    orderId: BigDecimal!
    traderAddress: String!
    marketId: String
    side: Int
    sideName: String
    orderType: Int!
    orderTypeName: String
    offsetBps: Int
    size: BigDecimal
    filledSize: BigDecimal
    status: String!
    placedAt: DateTime!
    placedBlock: Int!
    placedTxHash: String!
    resolvedAt: DateTime
    resolvedBlock: Int
    resolvedTxHash: String
    market: SpotMarket
    fills: [SpotOrderFill!]!
  }

  type SpotOrderFill {
    id: Int!
    orderId: BigDecimal!
    traderAddress: String!
    marketId: String!
    fillSize: BigDecimal!
    fillPrice: BigDecimal!
    fillScore: BigDecimal
    blockNumber: Int!
    txHash: String!
    logIndex: Int!
    blockTimestamp: DateTime!
  }

  type SpotBatchClearing {
    id: Int!
    marketId: String!
    clearingOffsetBps: Int!
    clearingPrice: BigDecimal!
    matchedVolume: BigDecimal!
    numBuysFilled: Int!
    numSellsFilled: Int!
    blockNumber: Int!
    txHash: String!
    logIndex: Int!
    blockTimestamp: DateTime!
  }

  type SpotEpochSettlement {
    epochNumber: BigDecimal!
    usersProcessed: Int!
    onchainBlock: Int!
    blockNumber: Int!
    txHash: String!
    logIndex: Int!
    blockTimestamp: DateTime!
  }

  type SpotFastSettlement {
    id: Int!
    userAddress: String!
    tokenAddress: String!
    amount: BigDecimal!
    fee: BigDecimal!
    blockNumber: Int!
    txHash: String!
    logIndex: Int!
    blockTimestamp: DateTime!
  }

  type SpotCollateralMovement {
    id: Int!
    eventType: String!
    userAddress: String!
    tokenAddress: String!
    amount: BigDecimal!
    blockNumber: Int!
    txHash: String!
    logIndex: Int!
    blockTimestamp: DateTime!
  }

  type SpotMarketModeChange {
    id: Int!
    marketId: String!
    oldMode: Int!
    newMode: Int!
    batchModeUntilBlock: BigDecimal!
    blockNumber: Int!
    txHash: String!
    logIndex: Int!
    blockTimestamp: DateTime!
  }

  type SpotPofqUpdate {
    id: Int!
    entityAddress: String!
    newScore: BigDecimal!
    newWeight: BigDecimal!
    isVault: Boolean!
    blockNumber: Int!
    txHash: String!
    logIndex: Int!
    blockTimestamp: DateTime!
  }

  type SpotPLV {
    vaultAddress: String!
    isRegistered: Boolean!
    registeredAt: DateTime
    registeredBlock: Int
    registeredTxHash: String
    deregisteredAt: DateTime
    deregisteredBlock: Int
    deregisteredTxHash: String
  }

  type SpotKeeperCycle {
    id: Int!
    onchainTimestamp: Int!
    marketsEvaluated: Int!
    batchesCleared: Int!
    epochSettled: Boolean!
    blockNumber: Int!
    txHash: String!
    blockTimestamp: DateTime!
  }

  type SpotBatchClearFailure {
    id: Int!
    marketId: String!
    reason: String!
    blockNumber: Int!
    txHash: String!
    logIndex: Int!
    blockTimestamp: DateTime!
  }
