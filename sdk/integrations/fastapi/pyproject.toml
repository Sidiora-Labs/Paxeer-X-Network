[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "layerx-fastapi"
version = "0.1.0"
description = "Receipt-gated x402 FastAPI integration for the LayerX protocol"
requires-python = ">=3.11"
license = { text = "See the LayerX repository LICENSE" }
authors = [{ name = "Sidiora Labs" }]
dependencies = ["fastapi>=0.110", "layerx-sdk>=0.1.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[tool.layerx-build]
contract-major = 1
source-date-epoch = 315532800
