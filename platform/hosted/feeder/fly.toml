app = "paxeer-oracle-feeder"
primary_region = "iad"

[build]
# Build context is the repository root: fly deploy --config platform/hosted/feeder/fly.toml .
dockerfile = "Dockerfile"

[env]
LAYERX_FEEDER_CONFIG = "/data/feeder.json"
LAYERX_FEEDER_ORACLE_KEY_FILE = "/data/keys/oracle.key"
LAYERX_FEEDER_STATE_DIR = "/data/state"
LAYERX_FEEDER_READYZ_ADDR = "0.0.0.0:8080"

[[mounts]]
source = "feeder_state"
destination = "/data"

[[services]]
internal_port = 8080
protocol = "tcp"
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[services.http_checks]]
interval = "15s"
timeout = "5s"
grace_period = "30s"
method = "get"
path = "/readyz"
