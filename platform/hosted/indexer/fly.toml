app = "paxeer-indexer"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../../../docker/platform-indexer/Dockerfile"
  build-target = "fly"

[deploy]
  strategy = "immediate"

# One machine with one volume: the SQLite store has a single writer. No
# service and no public IP; the router reaches the TLS listener at
# https://paxeer-indexer.internal:8095 under the internal CA. The init
# (platform/hosted/indexer/fly-init.sh) reads LAYERX_INDEXER_START_BLOCK from
# the archive node at run time, and the Fly secrets LAYERX_INDEXER_EVM_URL and
# LAYERX_INDEXER_COMET_URL name the archive node's public RPC name and its
# CometBFT location.
[env]
  LAYERX_INDEXER_DB = "/data/state/indexer.sqlite"
  LAYERX_INDEXER_LISTEN = "[::]:8095"
  LAYERX_INDEXER_TLS_CERT_DER = "/data/tls/indexer/cert.der"
  LAYERX_INDEXER_TLS_KEY_DER = "/data/tls/indexer/key.der"
  LAYERX_INDEXER_EVM_CHAIN_ID = "125"
  LAYERX_INDEXER_EVM_CA_DER = "/usr/local/share/layerx/isrg-root-x1.der"
  LAYERX_INDEXER_COMET_CA_DER = "/usr/local/share/layerx/isrg-root-x1.der"
  LAYERX_INDEXER_RELAY_URL = "https://archive.paxeer.network"
  LAYERX_INDEXER_RELAY_CA_DER = "/usr/local/share/layerx/isrg-root-x1.der"
  LAYERX_INDEXER_ABI_DIR = "/usr/local/share/layerx/precompiles"

[[mounts]]
  source = "indexer_data"
  destination = "/data"
  initial_size = "20gb"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "10gb"
  auto_extend_size_limit = "200gb"
  snapshot_retention = 14

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  cpus = 2
  cpu_kind = "shared"
