[package]
name = "layerx-ai-artifacts"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"
license = "Apache-2.0"
publish = false

[[bin]]
name = "layerx-ai-artifacts"
path = "src/main.rs"

[dependencies]
layerx-programs-ai-market = { path = "../../../programs/crates/layerx-programs-ai-market" }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
getrandom = { version = "=0.2.17", features = ["std"] }
hex = "=0.4.3"
native-tls = "=0.2.18"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false }
rcgen = "=0.14.10"

[workspace]
