app = "paxeer-dashboard-web"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../../../../docker/platform-dashboard-web/Dockerfile"

[deploy]
  strategy = "rolling"

[env]
  HOSTNAME = "::"

# The dashboard web, at least two machines in ams and fra; next.config.ts
# rewrites /v1/dashboard to the dashboard API app over the private network.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 2

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/"
    protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
  cpu_kind = "shared"
