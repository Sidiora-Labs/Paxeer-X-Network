app = "paxeer-webhooks"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../../../docker/platform-webhooks/Dockerfile"
  build-target = "fly"

[deploy]
  strategy = "rolling"

# Two groups of at least two machines each, in ams and fra; the argument of
# platform/hosted/webhooks/fly-init.sh sets LAYERX_WEBHOOKS_ROLE, the listener
# and the role's credential paths. public serves only the developer API,
# plain on 9444 behind the http_service, and refuses every /internal route.
# ingress has no public service: it serves only the internal routes, TLS on
# [::]:443 at ingress.process.paxeer-webhooks.internal, and admits only an
# internal-CA client leaf carrying exactly one webhook role URI SAN
# (producer for the event producers of the router, the registry and the
# human service, operator for dispatch) together with that role's bearer.
# Each [[files]] secret is mounted only into the groups whose role reads it.
[processes]
  public = "public"
  ingress = "ingress"

[env]
  LAYERX_WEBHOOKS_REDIS_URL = "rediss://paxeer-internal-redis.internal:6379"
  LAYERX_WEBHOOKS_KMS_URL = "https://kms.process.paxeer-internal.internal:9443"
  LAYERX_WEBHOOKS_IDENTITY_URL = "https://paxeer-identity.internal:9443"
  LAYERX_WEBHOOKS_AUTHORITY_URL = "https://paxeer-human-service.internal:9445"
  LAYERX_WEBHOOKS_COMPONENT_URL = "https://paxeer-human-service.internal:9446"
  LAYERX_WEBHOOKS_JOURNEY_SOURCE_URL = "https://journeys.process.paxeer-internal.internal:9443"
  LAYERX_WEBHOOKS_PAYMENT_SOURCE_URL = "https://payments.process.paxeer-internal.internal:9443"
  LAYERX_WEBHOOKS_APPROVAL_SOURCE_URL = "https://approvals.process.paxeer-internal.internal:9443"
  LAYERX_WEBHOOKS_PROGRAM_SOURCE_URL = "https://programs.process.paxeer-internal.internal:9443"
  LAYERX_WEBHOOKS_LXP_WIRE_VERSION = "3"
  LAYERX_WEBHOOKS_DISPATCH_INTERVAL_SECONDS = "1"
  LAYERX_WEBHOOKS_DISPATCH_BUDGET = "64"
  LAYERX_WEBHOOKS_LEASE_SECONDS = "120"
  LAYERX_WEBHOOKS_RETENTION_EVENTS = "10000"
  LAYERX_WEBHOOKS_KEY_OVERLAP_SECONDS = "86400"
  LAYERX_WEBHOOKS_INTERNAL_CA_DER = "/run/layerx/ca/internal.der"
  LAYERX_WEBHOOKS_PUBLIC_CA_DER = "/run/layerx/ca/public.der"
  LAYERX_WEBHOOKS_CLIENT_IDENTITY_PKCS12 = "/run/layerx/client/identity.p12"
  LAYERX_WEBHOOKS_CLIENT_IDENTITY_PASSWORD_FILE = "/run/layerx/client/password"
  LAYERX_WEBHOOKS_REDIS_USERNAME_FILE = "/run/layerx/redis/username"
  LAYERX_WEBHOOKS_REDIS_PASSWORD_FILE = "/run/layerx/redis/password"
  LAYERX_WEBHOOKS_KMS_TOKEN_FILE = "/run/layerx/tokens/kms"
  LAYERX_WEBHOOKS_CURSOR_KEY_FILE = "/run/layerx/keys/cursor"

# The ingress server identity of tools/bringup/ca.sh issue developer.
[[files]]
  guest_path = "/run/layerx/tls/server.pem"
  secret_name = "WEBHOOKS_INGRESS_TLS_CERT"
  processes = ["ingress"]

[[files]]
  guest_path = "/run/layerx/tls/server.der"
  secret_name = "WEBHOOKS_INGRESS_TLS_CERT_DER"
  processes = ["ingress"]

[[files]]
  guest_path = "/run/layerx/tls/server-key.der"
  secret_name = "WEBHOOKS_INGRESS_TLS_KEY_DER"
  processes = ["ingress"]

# The client identity of tools/bringup/ca.sh issue developer-client, whose CA
# DER is the internal CA root every private upstream and the Redis verify
# against, and the root the ingress verifies producer and operator leaves
# against.
[[files]]
  guest_path = "/run/layerx/client/cert.pem"
  secret_name = "WEBHOOKS_CLIENT_CERT"

[[files]]
  guest_path = "/run/layerx/client/identity.p12"
  secret_name = "WEBHOOKS_CLIENT_P12"

[[files]]
  guest_path = "/run/layerx/client/password"
  secret_name = "WEBHOOKS_CLIENT_PASSWORD"

[[files]]
  guest_path = "/run/layerx/ca/internal.der"
  secret_name = "WEBHOOKS_CLIENT_CA_DER"

[[files]]
  guest_path = "/run/layerx/ca/public.der"
  secret_name = "WEBHOOKS_PUBLIC_CA"

[[files]]
  guest_path = "/run/layerx/redis/username"
  secret_name = "WEBHOOKS_REDIS_USERNAME"

[[files]]
  guest_path = "/run/layerx/redis/password"
  secret_name = "WEBHOOKS_REDIS_PASSWORD"

[[files]]
  guest_path = "/run/layerx/tokens/kms"
  secret_name = "WEBHOOKS_KMS_TOKEN"

[[files]]
  guest_path = "/run/layerx/tokens/identity"
  secret_name = "WEBHOOKS_IDENTITY_TOKEN"
  processes = ["public"]

[[files]]
  guest_path = "/run/layerx/tokens/component"
  secret_name = "WEBHOOKS_COMPONENT_TOKEN"
  processes = ["ingress"]

[[files]]
  guest_path = "/run/layerx/tokens/authority"
  secret_name = "WEBHOOKS_AUTHORITY_TOKEN"
  processes = ["ingress"]

[[files]]
  guest_path = "/run/layerx/tokens/journey"
  secret_name = "WEBHOOKS_JOURNEY_SOURCE_TOKEN"
  processes = ["ingress"]

[[files]]
  guest_path = "/run/layerx/tokens/payment"
  secret_name = "WEBHOOKS_PAYMENT_SOURCE_TOKEN"
  processes = ["ingress"]

[[files]]
  guest_path = "/run/layerx/tokens/approval"
  secret_name = "WEBHOOKS_APPROVAL_SOURCE_TOKEN"
  processes = ["ingress"]

[[files]]
  guest_path = "/run/layerx/tokens/program"
  secret_name = "WEBHOOKS_PROGRAM_SOURCE_TOKEN"
  processes = ["ingress"]

[[files]]
  guest_path = "/run/layerx/tokens/source-trigger"
  secret_name = "WEBHOOKS_SOURCE_TRIGGER_TOKEN"
  processes = ["ingress"]

[[files]]
  guest_path = "/run/layerx/tokens/operator"
  secret_name = "WEBHOOKS_OPERATOR_TOKEN"
  processes = ["ingress"]

[[files]]
  guest_path = "/run/layerx/keys/cursor"
  secret_name = "WEBHOOKS_CURSOR_KEY"

[[files]]
  guest_path = "/run/layerx/keys/sequencer"
  secret_name = "WEBHOOKS_SEQUENCER_PUBLIC_KEY"
  processes = ["ingress"]

[[files]]
  guest_path = "/run/layerx/keys/sequencer-id"
  secret_name = "WEBHOOKS_SEQUENCER_ID"
  processes = ["ingress"]

[[files]]
  guest_path = "/run/layerx/keys/sequencer-first-batch"
  secret_name = "WEBHOOKS_SEQUENCER_FIRST_BATCH"
  processes = ["ingress"]

[[files]]
  guest_path = "/run/layerx/keys/sequencer-last-batch"
  secret_name = "WEBHOOKS_SEQUENCER_LAST_BATCH"
  processes = ["ingress"]

[http_service]
  internal_port = 9444
  processes = ["public"]
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 2

  [http_service.concurrency]
    type = "requests"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"
    protocol = "http"

[checks.ingress]
  type = "tcp"
  port = 443
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
  processes = ["ingress"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
  cpus = 2
  cpu_kind = "shared"
