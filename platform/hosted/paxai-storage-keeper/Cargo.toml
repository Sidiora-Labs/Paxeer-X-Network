[package]
name = "paxai-storage-keeper"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"
license = "Apache-2.0"
publish = false

[[bin]]
name = "paxai-storage-keeper"
path = "src/main.rs"

[dependencies]
layerx-platform-authority = { path = "../authority" }
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"

[workspace]
