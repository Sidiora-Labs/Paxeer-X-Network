server_name: $RAILWAY_SERVICE_NAME
port: 4222
http_port: 8222
max_payload: 1048576

jetstream {
  store_dir: /data
  max_file_store: $NATS_MAX_FILE_STORE
}

cluster {
  name: perps-data
  port: 6222
  authorization {
    user: perps-route
    password: $NATS_CLUSTER_PASSWORD
  }
  routes: $NATS_ROUTES
}

accounts {
  PERPS {
    jetstream: enabled
    users: [
      {
        user: perps-indexer
        password: $NATS_INDEXER_PASSWORD
        permissions: {
          publish: { allow: ["perps.>", "$JS.API.>"] }
          subscribe: { allow: ["_INBOX.>"] }
        }
      }
      {
        user: perps-gateway
        password: $NATS_GATEWAY_PASSWORD
        permissions: {
          publish: { deny: [">"] }
          subscribe: { allow: ["perps.>"] }
        }
      }
    ]
  }
}
