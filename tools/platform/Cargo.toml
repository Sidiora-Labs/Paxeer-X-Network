[workspace]
members = [
    "cli",
    "emulator",
    "release",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91.1"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
ed25519-dalek = "=2.2.0"
getrandom = "=0.4.3"
keyring = "=4.1.6"
keyring-core = "=1.0.0"
rustix = { version = "=1.1.4", features = ["fs", "process"] }
layerx-platform-kvx = { path = "../../platform/tools/kvx", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ring = "=0.17.14"
sha2 = "=0.10.9"
subtle = "=2.6.1"
ureq = { version = "=3.4.0", default-features = false, features = ["json", "rustls-no-provider", "_ring"] }
rustls-native-certs = "=0.8.4"
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"
