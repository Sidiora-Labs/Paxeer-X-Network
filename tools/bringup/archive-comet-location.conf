# Server level, included in the 443 server block of the archive host's apiN
# vhost: the node's CometBFT JSON-RPC, read-only, at https://<apiN>/comet for
# the indexer. POST only, rate limited by the zone of archive-comet-zone.conf,
# proxied to the node's loopback CometBFT RPC, whose unsafe routes stay off.
location = /comet {
    limit_except POST { deny all; }
    limit_req zone=archive_comet burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    proxy_pass http://127.0.0.1:26657/;
}
