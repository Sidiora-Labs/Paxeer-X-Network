# rendered by tools/bringup/edge.sh; edit the manifest through it, not this file
server {
	listen 80;
	listen [::]:80;
	server_name api-mainnet-beta.paxeer.network;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
		default_type text/plain;
		try_files $uri =404;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name api-mainnet-beta.paxeer.network;

	ssl_certificate /etc/letsencrypt/live/api-mainnet-beta.paxeer.network/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/api-mainnet-beta.paxeer.network/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;

	client_max_body_size 0;
	resolver 127.0.0.53 valid=30s ipv6=off;

	location / {
		set $edge_upstream paxeer-shared-endpoint.fly.dev;
		proxy_pass https://$edge_upstream;
		proxy_http_version 1.1;
		proxy_set_header Host paxeer-shared-endpoint.fly.dev;
		proxy_set_header X-Forwarded-Host api-mainnet-beta.paxeer.network;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Origin $http_origin;
		proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
		proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $http_connection;
		proxy_ssl_server_name on;
		proxy_ssl_name paxeer-shared-endpoint.fly.dev;
		proxy_ssl_verify on;
		proxy_ssl_verify_depth 4;
		proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}
