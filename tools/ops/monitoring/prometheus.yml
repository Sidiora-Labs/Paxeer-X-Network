global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: cometbft
    file_sd_configs:
      - files: [/etc/prometheus/targets/cometbft.json]

  - job_name: node
    file_sd_configs:
      - files: [/etc/prometheus/targets/node.json]

  - job_name: monitor-node
    static_configs:
      - targets: [node-exporter:9100]
        labels:
          host: monitor

  - job_name: kernel-readyz
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/etc/prometheus/targets/readyz.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: sequencer-readyz
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/etc/prometheus/targets/sequencer-readyz.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: receipt-authority
    file_sd_configs:
      - files: [/etc/prometheus/targets/authority-metrics.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        regex: '(https?)://.*'
        target_label: __scheme__
        replacement: '$1'
      - source_labels: [__address__]
        regex: 'https?://[^/]+(/.*)'
        target_label: __metrics_path__
        replacement: '$1'
      - source_labels: [__address__]
        regex: 'https?://([^/]+)(/.*)?'
        target_label: __address__
        replacement: '$1'

  - job_name: edge-cert
    metrics_path: /probe
    params:
      module: [tls_cert]
    file_sd_configs:
      - files: [/etc/prometheus/targets/certs.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
